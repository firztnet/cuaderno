<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f151c">
<title>Digesto · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral fija con las secciones del panel (pestañas arriba en el teléfono) y área de trabajo; mismo lenguaje visual que Digesto, en tono de consola */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d9dfe6;
  --ink:#16202c; --muted:#55626f; --accent:#1f4e79; --accent-soft:#e1eaf3;
  --seal:#8a2b3a; --ok:#2f7a4f; --warn:#96560a; --crit:#b3312f; --gold:#86610f;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; --gold:#d8b25a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{font-size:13px;color:var(--muted)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{all:unset;cursor:pointer;box-sizing:border-box;background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:active{opacity:.75}
.iconbtn{all:unset;cursor:pointer;color:var(--muted);padding:5px 8px;border-radius:6px;font-size:13px;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.grid2>*{min-width:0}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
/* Acceso */
.login{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 26px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.seal{width:52px;height:52px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-style:italic;margin:0 auto}
.brand{font-family:var(--f-display);font-size:22px;text-align:center}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.err{color:var(--crit);font-size:14px;font-weight:500;min-height:1.4em}
.pw{position:relative;display:block}
.pw input{padding-right:46px}
.pwbtn{all:unset;cursor:pointer;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
/* Estructura */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.side .brand{text-align:left;padding-inline:10px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs .n{margin-left:auto;font-family:var(--f-mono);font-size:11px}
.who{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:10px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;font-size:13px}
main{padding:30px 36px 60px;min-width:0;max-width:1500px;width:100%;margin-inline:auto}
main:focus{outline:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
/* Cifras y gráficas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.alert b{color:var(--crit)}
.kpi.good b{color:var(--ok)}
.wbars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:16px}
.wbars>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:10px;color:var(--muted);white-space:nowrap}
.wbars i{display:block;width:100%;max-width:46px;border-radius:5px 5px 0 0;background:var(--accent);min-height:3px}
.wbars b{font-size:12px;color:var(--ink)}
.seg{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:16px 0 12px;background:var(--surface-2)}
.seg i{display:block;height:100%}
.lg{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.lg b{color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
/* Cuentas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:200px}
.toolbar select{width:auto;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc.off{border-style:dashed}
.acc.off .av{filter:grayscale(1)}
.acc-h{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:20px;font-weight:600}
.em{font-weight:600;overflow-wrap:anywhere;word-break:break-word}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.bdg.adm{color:var(--seal)} .bdg.off{color:var(--crit)} .bdg.unc{color:var(--warn)} .bdg.me{color:var(--accent)} .bdg.on{color:var(--ok)} .bdg.mut{color:var(--muted)}
.ameta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:13px;color:var(--muted)}
.ameta b{color:var(--ink);font-weight:600}
.ause{display:flex;gap:6px;flex-wrap:wrap}
.ause span{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
.aact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
/* Comunicados: la vista previa es exactamente el banner que ven los estudiantes */
.coms{display:flex;flex-direction:column;gap:12px}
.com{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.com-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.com .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.com .m{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 12%,var(--surface));border-radius:var(--r);padding:12px 14px;--bc:var(--accent)}
.banner.mantenimiento{--bc:var(--warn)} .banner.urgente{--bc:var(--crit)}
.banner .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--bc)}
.banner .t{font-weight:600}
.banner .m{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.banner .w{font-size:13px;font-weight:600;margin-top:2px}
/* Historial */
.log{width:100%;border-collapse:collapse;font-size:14px}
.log th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.log td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.log td.c{white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
/* Formularios */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(620px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow-y:auto}
dialog::backdrop{background:rgba(10,15,20,.5)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:18px;height:18px;flex:none}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}main{padding-inline:24px}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;align-items:center;gap:10px;padding:8px 12px calc(8px);border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .side::-webkit-scrollbar{display:none}
  .side .brand,.who{display:none}
  .tabs{flex-direction:row;gap:4px}
  .tabs button{padding:9px 12px;white-space:nowrap;font-size:14px}
  .tabs .n{display:none}
  main{padding:20px 16px 60px}
  h1{font-size:26px}
  .form{grid-template-columns:1fr}
  .accs{grid-template-columns:1fr}
  .ameta{grid-template-columns:1fr}
  input,select,textarea{font-size:16px}
  .head>.hbtns{flex:1 1 100%}
  .head>.hbtns .btn{flex:1}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="login" id="login">
  <form class="card" id="loginForm" aria-label="Acceso a la administración de Digesto">
    <div class="seal">§</div>
    <div class="brand">Digesto<small>Administración</small></div>
    <label for="lEmail">Correo<input id="lEmail" type="email" autocomplete="username" required></label>
    <label for="lPass">Contraseña<span class="pw"><input id="lPass" type="password" autocomplete="current-password" required><button type="button" class="pwbtn" id="lEye" aria-label="Ver la contraseña"></button></span></label>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn" type="submit" id="lGo">Entrar</button>
    <p class="sub" style="margin:0;text-align:center">Solo para cuentas con permisos de administración.</p>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand">Digesto<small>Administración</small></div>
    <nav class="tabs" id="tabs" aria-label="Secciones del panel"></nav>
    <div class="who"><span>Has entrado como</span><b id="whoEmail"></b><button class="linkbtn" id="outBtn">Cerrar sesión</button></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg"><form id="F" method="dialog"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL="https://czskesruiyrmrgfwukbv.supabase.co";
const SUPA_KEY="sb_publishable_2lBXhGkjIlnA4Tg2egBBWA_BNsPrqGh";
/* La sesión de administración va aparte de la de estudiante y se cierra al cerrar la pestaña */
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:"digesto-admin",storage:sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

const $=s=>document.querySelector(s), main=$("#main"), dlg=$("#dlg"), F=$("#F");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>Number(n).toLocaleString("es-ES",{maximumFractionDigits:1});
const fold=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const D=864e5;
const relT=ts=>{if(!ts)return "nunca";const d=Math.floor((Date.now()-Date.parse(ts))/D);return d<=0?"hoy":d===1?"ayer":d<30?`hace ${d} días`:d<365?`hace ${Math.round(d/30)} ${Math.round(d/30)===1?"mes":"meses"}`:"hace más de un año"};
const fmtB=b=>b<1024?b+" B":b<1048576?nf(b/1024)+" KB":nf(b/1048576)+" MB";
const fmtDT=ts=>ts?new Date(ts).toLocaleString("es-ES",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const toInput=ts=>{if(!ts)return "";const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const fromInput=v=>v?new Date(v).toISOString():null;
const lastAct=r=>Math.max(r.ultimo_acceso?Date.parse(r.ultimo_acceso):0,r.guardado?Date.parse(r.guardado):0);
const avHue=e=>[...String(e||"?")].reduce((a,ch)=>(a*31+ch.charCodeAt(0))%360,7);
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3400)}
const errText=e=>{const m=((e&&e.message)||"").toLowerCase();
 return m.includes("solo para administradores")?"Esta cuenta no tiene permisos de administración.":m.includes("could not find")||m.includes("does not exist")||m.includes("schema cache")?"Falta preparar esta parte en Supabase: ejecuta supabase-admin-2.sql en el SQL Editor.":(e&&e.message)||"Error desconocido."};

/* ---------- ACCESO ---------- */
let ME=null, VIEW="resumen";
$("#lEye").innerHTML=EYE;$("#lEye").onclick=()=>{const i=$("#lPass"),s=i.type==="password";i.type=s?"text":"password";$("#lEye").setAttribute("aria-label",s?"Ocultar la contraseña":"Ver la contraseña")};
function showLogin(msg){$("#app").hidden=true;$("#login").hidden=false;$("#lErr").textContent=msg||"";$("#lGo").textContent="Entrar";delete $("#lGo").dataset.busy}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const b=$("#lGo");if(b.dataset.busy)return;b.dataset.busy=1;b.textContent="Un momento…";$("#lErr").textContent="";
 const {data,error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});
 if(error){const m=(error.message||"").toLowerCase();return showLogin(m.includes("invalid login")?"Correo o contraseña incorrectos.":m.includes("banned")?"Esta cuenta está desactivada.":"No se pudo entrar. Revisa la conexión.")}
 enter(data.session)};
async function enter(ses){
 const {data,error}=await sb.rpc("digesto_mi_estado");
 if(error){await sb.auth.signOut({scope:"local"});return showLogin("Falta preparar el panel en Supabase: ejecuta supabase-admin.sql.")}
 if(!data||!data.admin){await sb.auth.signOut({scope:"local"});return showLogin("Esta cuenta no tiene permisos de administración. Los estudiantes entran por la web de Digesto.")}
 ME={id:ses.user.id,email:ses.user.email||""};$("#whoEmail").textContent=ME.email;
 $("#login").hidden=true;$("#app").hidden=false;go(VIEW);loadAll()}
async function signOut(){await sb.auth.signOut({scope:"local"}).catch(()=>{});ME=null;DATA={};showLogin("Sesión cerrada.")}
$("#outBtn").onclick=signOut;
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&ME){ME=null;setTimeout(()=>showLogin("La sesión ha caducado. Vuelve a entrar."),0)}});

/* ---------- DATOS ---------- */
let DATA={};
async function call(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
async function loadAll(){DATA.loading=true;render();
 const run=async(k,fn)=>{try{DATA[k]=await call(fn);DATA[k+"Err"]=""}catch(e){DATA[k]=null;DATA[k+"Err"]=errText(e)}};
 await Promise.all([run("cuentas","digesto_admin_cuentas"),run("aj","digesto_admin_ajustes"),run("coms","digesto_admin_comunicados"),run("acc","digesto_admin_acciones")]);
 DATA.loading=false;DATA.at=new Date();render()}
async function act(fn,args,ok){try{await call(fn,args);toast(ok);await loadAll()}catch(e){toast("No se pudo completar: "+errText(e))}}

/* ---------- NAVEGACIÓN ---------- */
const VIEWS={resumen:["Resumen",vResumen],cuentas:["Cuentas",vCuentas],comunicados:["Comunicados",vComunicados],registro:["Registro",vRegistro],historial:["Historial",vHistorial],cuenta:["Mi cuenta",vCuenta]};
function go(v){VIEW=VIEWS[v]?v:"resumen";try{history.replaceState(null,"","#"+VIEW)}catch(e){}render();window.scrollTo(0,0);main.focus({preventScroll:true})}
function render(){
 const counts={cuentas:DATA.cuentas&&DATA.cuentas.length,comunicados:DATA.coms&&DATA.coms.filter(c=>comState(c)==="Visible ahora").length};
 $("#tabs").innerHTML=Object.entries(VIEWS).map(([k,[l]])=>`<button data-v="${k}" aria-current="${k===VIEW}">${l}${counts[k]?`<span class="n">${counts[k]}</span>`:""}</button>`).join("");
 $("#tabs").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
 VIEWS[VIEW][1]();
 main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 main.querySelectorAll("[data-ref]").forEach(b=>b.onclick=loadAll)}
const head=(eyebrow,title,text,btns="")=>`<div class="head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${text?`<p>${text}</p>`:""}</div><div class="hbtns"><button class="btn ghost" data-ref>${DATA.loading?"Cargando…":"Actualizar"}</button>${btns}</div></div>`;
const errBox=m=>`<div class="panel"><h2>No disponible</h2><p class="sub" style="margin:8px 0 0">${esc(m)}</p></div>`;

/* ---------- RESUMEN ---------- */
function vResumen(){
 const rows=DATA.cuentas;

let AQ="", AF="todas", AS="recientes";
function vCuentas(){
 const rows=DATA.cuentas;
 if(!rows){main.innerHTML=head("Cuentas","Cuentas de Digesto","")+(DATA.cuentasErr?errBox(DATA.cuentasErr):`<div class="panel empty">Cargando…</div>`);return}
 const off=rows.filter(r=>!r.activa).length,unc=rows.filter(r=>!r.confirmado).length;
 const chips=[["todas","Todas",rows.length],["activas","Activas",rows.length-off],["off","Desactivadas",off],["admin","Administración",rows.filter(r=>r.es_admin).length],["unc","Sin confirmar",unc],["inactivas","Sin actividad en 30 días",rows.filter(r=>Date.now()-lastAct(r)>=30*D).length]];
 main.innerHTML=head("Cuentas","Cuentas de Digesto","Activa, desactiva o elimina cuentas y da permisos de administración. Nunca se muestra el contenido de los cuadernos.",`<button class="btn" id="aCsv">Exportar lista</button>`)+`
 <div class="toolbar"><input id="aq" type="search" placeholder="Buscar por correo…" aria-label="Buscar cuentas" autocomplete="off" value="${esc(AQ)}"><select id="as" aria-label="Ordenar cuentas">${[["recientes","Altas más recientes"],["acceso","Actividad más reciente"],["uso","Más espacio usado"],["correo","Correo (A-Z)"]].map(([k,v])=>`<option value="${k}" ${AS===k?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="chips">${chips.map(([k,l,n])=>`<button class="chip" data-af="${k}" aria-pressed="${AF===k}">${l} (${n})</button>`).join("")}</div>
 <div id="alist"></div>`;
 paintAccounts();
 const q=$("#aq");q.oninput=()=>{AQ=q.value;paintAccounts()};
 $("#as").onchange=e=>{AS=e.target.value;paintAccounts()};
 main.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{AF=b.dataset.af;render()});
 $("#aCsv").onclick=exportCsv}
function accRows(){const f=fold(AQ.trim()),now=Date.now();
 const L=DATA.cuentas.filter(r=>(!f||fold(r.email).includes(f))&&(AF==="todas"||(AF==="activas"&&r.activa)||(AF==="off"&&!r.activa)||(AF==="admin"&&r.es_admin)||(AF==="unc"&&!r.confirmado)||(AF==="inactivas"&&now-lastAct(r)>=30*D)));
 return L.sort((a,b)=>AS==="acceso"?lastAct(b)-lastAct(a):AS==="uso"?(b.bytes||0)-(a.bytes||0):AS==="correo"?String(a.email).localeCompare(String(b.email)):Date.parse(b.creado)-Date.parse(a.creado))}
function accCard(r){const me=ME&&r.id===ME.id,id=esc(r.id),em=esc(r.email||"(sin correo)");
 return `<div class="acc ${r.activa?"":"off"}"><div class="acc-h"><span class="av" style="background:hsl(${avHue(r.email)} 50% 40%)" aria-hidden="true">${esc((r.email||"?")[0].toUpperCase())}</span>
  <div style="min-width:0"><div class="em">${em}</div><div class="badges">${me?`<span class="bdg me">Tú</span>`:""}${r.es_admin?`<span class="bdg adm">Administración</span>`:""}<span class="bdg ${r.activa?"on":"off"}">${r.activa?"Activa":"Desactivada"}</span>${r.confirmado?"":`<span class="bdg unc">Correo sin confirmar</span>`}${Date.now()-lastAct(r)>=30*D?`<span class="bdg mut">Sin actividad</span>`:""}</div></div></div>
  <div class="ameta"><span>Alta: <b>${new Date(r.creado).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}</b></span><span>Último acceso: <b>${relT(r.ultimo_acceso)}</b></span><span>Último guardado: <b>${relT(r.guardado)}</b></span><span>Espacio: <b>${fmtB(r.bytes||0)}</b></span></div>
  <div class="ause"><span>${r.asignaturas} asignaturas</span><span>${r.temas} temas</span><span>${r.fichas} fichas</span><span>${r.fechas} fechas</span></div>
  <div class="aact">${me?`<span class="sub">Tu cuenta no se puede desactivar ni eliminar desde aquí.</span>`:`<button class="btn ghost small" data-aon="${id}" data-val="${r.activa?0:1}" data-em="${em}">${r.activa?"Desactivar":"Activar"}</button><button class="btn ghost small" data-aadm="${id}" data-val="${r.es_admin?0:1}" data-em="${em}">${r.es_admin?"Quitar administración":"Dar administración"}</button><button class="btn ghost small danger" data-adel="${id}" data-em="${em}">Eliminar</button>`}</div></div>`}
function paintAccounts(){const box=$("#alist");if(!box)return;const L=accRows();
 box.innerHTML=L.length?`<div class="accs">${L.map(accCard).join("")}</div>`:`<div class="panel empty">Ninguna cuenta coincide con la búsqueda o el filtro.</div>`;
 box.querySelectorAll("[data-aon]").forEach(b=>b.onclick=()=>{const on=b.dataset.val==="1";

  confirmBox(`${b.dataset.em} no podrá entrar ni ver su cuaderno hasta que la vuelvas a activar. Sus datos se conservan.`,"Desactivar",()=>act("digesto_admin_activar",{objetivo:b.dataset.aon,valor:false},"Cuenta desactivada."))});
 box.querySelectorAll("[data-aadm]").forEach(b=>b.onclick=()=>{const on=b.dataset.val==="1";

  confirmBox(`${b.dataset.em} podrá entrar en este panel y activar, desactivar o eliminar cualquier cuenta.`,"Dar administración",()=>act("digesto_admin_hacer_admin",{objetivo:b.dataset.aadm,valor:true},"Ahora también administra Digesto."))});
 box.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>confirmBox(`Se eliminará la cuenta ${b.dataset.em} y su cuaderno entero, para siempre. No se puede deshacer. Si dudas, desactívala en su lugar.`,"Eliminar para siempre",()=>act("digesto_admin_eliminar",{objetivo:b.dataset.adel},"Cuenta eliminada.")))}
function exportCsv(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',d=t=>t?new Date(t).toLocaleString("es-ES"):"";
 const lines=[["Correo","Alta","Último acceso","Último guardado","Activa","Administración","Correo confirmado","Asignaturas","Temas","Fichas","Fechas","Bytes"].map(q).join(";"),
  ...DATA.cuentas.map(r=>[r.email,d(r.creado),d(r.ultimo_acceso),d(r.guardado),r.activa?"sí":"no",r.es_admin?"sí":"no",r.confirmado?"sí":"no",r.asignaturas,r.temas,r.fichas,r.fechas,r.bytes].map(q).join(";"))];
 download("digesto-cuentas-"+new Date().toISOString().slice(0,10)+".csv","﻿"+lines.join("\r\n"),"text/csv");toast("Lista descargada.")}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

const CT={info:"Aviso",mantenimiento:"Mantenimiento",urgente:"Urgente"};
function comState(c){const now=Date.now();if(!c.activo)return "Retirado";if(c.desde&&Date.parse(c.desde)>now)return "Programado";if(c.hasta&&Date.parse(c.hasta)<=now)return "Caducado";return "Visible ahora"}
function mantText(c){if(!c.mant_inicio)return "";const a=new Date(c.mant_inicio),b=c.mant_fin?new Date(c.mant_fin):null;
 const day=x=>x.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}),hr=x=>x.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
 if(!b)return `Desde el ${day(a)} a las ${hr(a)}.`;
 return a.toDateString()===b.toDateString()?`El ${day(a)}, de ${hr(a)} a ${hr(b)}.`:`Del ${day(a)} a las ${hr(a)} al ${day(b)} a las ${hr(b)}.`}
function bannerHtml(c){return `<div class="banner ${esc(c.tipo)}"><div style="min-width:0"><div class="k">${CT[c.tipo]||"Aviso"}</div><div class="t">${esc(c.titulo)}</div>${c.mensaje?`<div class="m">${esc(c.mensaje)}</div>`:""}${c.tipo==="mantenimiento"&&c.mant_inicio?`<div class="w">${esc(mantText(c))}</div>`:""}</div></div>`}
function vComunicados(){
 main.innerHTML=head("Comunicados","Comunicados a todas las cuentas","Lo que publiques aparece arriba en Digesto para todos los estudiantes, y también en la pantalla de acceso. Úsalo para avisar de un mantenimiento, una novedad o algo urgente.",`<button class="btn ghost" id="cTpl">Plantilla de mantenimiento</button><button class="btn" id="cNew">Nuevo comunicado</button>`)+

  <div class="hbtns"><button class="btn ghost small" data-ced="${c.id}">Editar</button><button class="btn ghost small" data-ctog="${c.id}">${c.activo?"Retirar":"Volver a publicar"}</button><button class="btn ghost small danger" data-cdel="${c.id}">Borrar</button></div></div>
  ${bannerHtml(c)}
  <div class="sub">${c.desde?"Se muestra desde "+fmtDT(c.desde):"Se muestra desde que se publicó"}${c.hasta?" hasta "+fmtDT(c.hasta):", sin fecha de fin"}.</div></div>`}).join("")}</div>`:`<div class="panel empty">Aún no has publicado ningún comunicado.</div>`):DATA.comsErr?errBox(DATA.comsErr):`<div class="panel empty">Cargando…</div>`);
 $("#cNew").onclick=()=>comForm();
 $("#cTpl").onclick=()=>{const a=new Date();a.setDate(a.getDate()+1);a.setHours(22,0,0,0);const b=new Date(a);b.setHours(23,59,0,0);

 main.querySelectorAll("[data-ced]").forEach(b=>b.onclick=()=>comForm(DATA.coms.find(c=>String(c.id)===b.dataset.ced)));
 main.querySelectorAll("[data-ctog]").forEach(b=>b.onclick=()=>{const c=DATA.coms.find(x=>String(x.id)===b.dataset.ctog);saveCom({...c,activo:!c.activo},c.activo?"Comunicado retirado.":"Comunicado publicado de nuevo.")});
 main.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{const c=DATA.coms.find(x=>String(x.id)===b.dataset.cdel);confirmBox(`Se borrará el comunicado «${c.titulo}». Si solo quieres que deje de verse, usa Retirar.`,"Borrar",()=>act("digesto_admin_borrar_comunicado",{p_id:c.id},"Comunicado borrado."))})}
async function saveCom(c,ok){return act("digesto_admin_guardar_comunicado",{p_id:c.id??null,p_titulo:c.titulo,p_mensaje:c.mensaje||"",p_tipo:c.tipo,p_desde:c.desde||null,p_hasta:c.hasta||null,p_mant_inicio:c.mant_inicio||null,p_mant_fin:c.mant_fin||null,p_activo:c.activo!==false},ok)}

 const inv=$("#rInv"),add=()=>{const v=inv.value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return toast("Escribe un correo válido.");act("digesto_admin_invitar",{correo:v,valor:true},"Invitado: "+v)};
 $("#rAdd").onclick=add;inv.onkeydown=e=>{if(e.key==="Enter")add()};
 main.querySelectorAll("[data-unv]").forEach(b=>b.onclick=()=>act("digesto_admin_invitar",{correo:b.dataset.unv,valor:false},"Invitación retirada."))}

/* ---------- HISTORIAL ---------- */
let HQ="";
function vHistorial(){
 const L=DATA.acc;
 if(!L){main.innerHTML=head("Historial","Historial de acciones","")+(DATA.accErr?errBox(DATA.accErr):`<div class="panel empty">Cargando…</div>`);return}
 main.innerHTML=head("Historial","Historial de acciones","Cada acción hecha desde este panel queda registrada con quién la hizo y cuándo. Se muestran las 300 últimas.",L.length?`<button class="btn" id="hCsv">Exportar</button>`:"")+`
 <div class="toolbar"><input id="hq" type="search" placeholder="Buscar en el historial…" aria-label="Buscar en el historial" autocomplete="off" value="${esc(HQ)}"></div><div class="panel tablewrap" id="hlist"></div>`;
 const paint=()=>{const f=fold(HQ.trim()),R=L.filter(a=>!f||fold([a.accion,a.detalle,a.admin_email].join(" ")).includes(f));
  $("#hlist").innerHTML=R.length?`<table class="log"><thead><tr><th>Cuándo</th><th>Acción</th><th>Detalle</th><th>Quién</th></tr></thead><tbody>${R.map(a=>`<tr><td class="c">${new Date(a.cuando).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td><b>${esc(a.accion)}</b></td><td>${esc(a.detalle)}</td><td>${esc(a.admin_email||"")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">${L.length?"Nada coincide con la búsqueda.":"Todavía no hay acciones registradas."}</div>`};
 paint();const q=$("#hq");q.oninput=()=>{HQ=q.value;paint()};
 const c=$("#hCsv");if(c)c.onclick=()=>{const q2=v=>'"'+String(v??"").replace(/"/g,'""')+'"';download("digesto-historial-"+new Date().toISOString().slice(0,10)+".csv","﻿"+[["Cuándo","Acción","Detalle","Quién"].map(q2).join(";"),...L.map(a=>[new Date(a.cuando).toLocaleString("es-ES"),a.accion,a.detalle,a.admin_email].map(q2).join(";"))].join("\r\n"),"text/csv");toast("Historial descargado.")}}

/* ---------- MI CUENTA ---------- */
function vCuenta(){
 main.innerHTML=head("Mi cuenta","Tu cuenta de administración","")+`
 <div class="grid2"><div class="panel stack"><h2>Acceso</h2><p class="sub" style="margin:0">Has entrado como <b>${esc(ME&&ME.email)}</b>. La sesión de este panel se cierra al cerrar la pestaña.</p>
  <label for="mP1">Nueva contraseña (mínimo 8 caracteres)<input id="mP1" type="password" autocomplete="new-password"></label>
  <label for="mP2">Repite la contraseña<input id="mP2" type="password" autocomplete="new-password"></label>
  <div class="hbtns"><button class="btn" id="mSave">Cambiar contraseña</button><button class="btn ghost" id="mOut">Cerrar sesión</button></div></div>
 <div class="panel stack"><h2>Sobre este panel</h2><p class="sub" style="margin:0">Es una web aparte de la de los estudiantes. Las acciones las comprueba Supabase una a una: aunque alguien encontrara esta dirección, sin permisos de administración no puede ver ni hacer nada.</p></div></div>`;
 $("#mOut").onclick=signOut;
 $("#mSave").onclick=async()=>{const p=$("#mP1").value;if(p.length<8)return toast("La contraseña necesita al menos 8 caracteres.");if(p!==$("#mP2").value)return toast("Las contraseñas no coinciden.");
  const {error}=await sb.auth.updateUser({password:p});toast(error?"No se pudo cambiar: "+error.message:"Contraseña cambiada.");if(!error)render()}}

/* ---------- CONFIRMACIONES ---------- */
function confirmBox(msg,okLabel,yes){F.onsubmit=e=>e.preventDefault();
 F.innerHTML=`<h2 style="margin-bottom:10px">¿Seguro?</h2><p style="margin:0 0 6px">${esc(msg)}</p><div class="form"><div class="actions"><button type="button" class="btn ghost" id="kNo">Cancelar</button><button type="button" class="btn" id="kYes">${esc(okLabel)}</button></div></div>`;
 $("#kNo").onclick=()=>dlg.close();$("#kYes").onclick=()=>{dlg.close();yes()};dlg.showModal()}

/* ---------- ARRANQUE ---------- */
VIEW=(location.hash||"").slice(1)||"resumen";
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session)return enter(data.session)}catch(e){}showLogin("")})();
setInterval(()=>{if(ME&&!document.hidden&&!dlg.open)loadAll()},120000);
</script>
