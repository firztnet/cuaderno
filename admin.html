<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d4a5a">
<link rel="icon" href="icono-agenda.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-agenda-180.png">
<meta name="apple-mobile-web-app-title" content="Agenda Firztnet">
<link rel="manifest" href="manifest-admin.webmanifest">
<script>try{var t=localStorage.getItem("digesto-admin-tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.theme=t==="claro"?"light":"dark"}catch(e){}</script>
<title>Agenda Firztnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral fija con las secciones del panel (pestañas arriba en el teléfono) y área de trabajo; lenguaje visual propio de Agenda Firztnet */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d9dfe6;
  --ink:#16202c; --muted:#55626f; --accent:#1f4e79; --accent-soft:#e1eaf3;
  --seal:#8a2b3a; --ok:#2f7a4f; --warn:#96560a; --crit:#b3312f; --gold:#86610f;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
/* Apariencia: automática según el dispositivo, o claro/oscuro elegido en el panel (data-theme) */
:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; --gold:#d8b25a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; --gold:#d8b25a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{font-size:13px;color:var(--muted)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{all:unset;cursor:pointer;box-sizing:border-box;background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:active{opacity:.75}
.iconbtn{all:unset;cursor:pointer;color:var(--muted);padding:5px 8px;border-radius:6px;font-size:13px;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.grid2>*{min-width:0}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
/* Acceso */
.login{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 26px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.seal{width:52px;height:52px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-style:italic;margin:0 auto}
.brand{font-family:var(--f-display);font-size:22px;text-align:center}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.err{color:var(--crit);font-size:14px;font-weight:500;min-height:1.4em}
.pw{position:relative;display:block}
.pw input{padding-right:46px}
.pwbtn{all:unset;cursor:pointer;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
/* Estructura */
.shell{min-height:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .brand{text-align:left;font-size:19px;line-height:1.1}
.topbar .brand small{font-size:10px}
.topbar .here{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .logo{border-radius:8px;flex:none}
.hamb{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--ink);flex:none}
.hamb:hover{background:var(--surface-2)}
.side{position:fixed;z-index:50;top:0;left:0;bottom:0;width:min(280px,84vw);background:var(--surface);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;visibility:hidden;box-shadow:8px 0 30px rgba(0,0,0,.18)}
.side.open{transform:none;visibility:visible}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(10,15,20,.45)}
.side .brand{text-align:left;padding-inline:10px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs .n{margin-left:auto;font-family:var(--f-mono);font-size:11px}
.who{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:10px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;font-size:13px}
main{padding:30px 36px 60px;min-width:0;max-width:1500px;width:100%;margin-inline:auto}
main:focus{outline:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
/* Cifras y gráficas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.alert b{color:var(--crit)}
.kpi.good b{color:var(--ok)}
.wbars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:16px}
.wbars>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:10px;color:var(--muted);white-space:nowrap}
.wbars i{display:block;width:100%;max-width:46px;border-radius:5px 5px 0 0;background:var(--accent);min-height:3px}
.wbars b{font-size:12px;color:var(--ink)}
.seg{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:16px 0 12px;background:var(--surface-2)}
.seg i{display:block;height:100%}
.lg{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.lg b{color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
/* Cuentas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:200px}
.toolbar select{width:auto;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc.off{border-style:dashed}
.acc.off .av{filter:grayscale(1)}
.acc-h{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:20px;font-weight:600}
.em{font-weight:600;overflow-wrap:anywhere;word-break:break-word}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.bdg.adm{color:var(--seal)} .bdg.off{color:var(--crit)} .bdg.unc{color:var(--warn)} .bdg.me{color:var(--accent)} .bdg.on{color:var(--ok)} .bdg.mut{color:var(--muted)}
.ameta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:13px;color:var(--muted)}
.ameta b{color:var(--ink);font-weight:600}
.ause{display:flex;gap:6px;flex-wrap:wrap}
.ause span{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
.aact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
/* Comunicados: la vista previa es exactamente el banner que ven los estudiantes */
.coms{display:flex;flex-direction:column;gap:12px}
.com{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.com-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.com .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.com .m{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 12%,var(--surface));border-radius:var(--r);padding:12px 14px;--bc:var(--accent)}
.banner.mantenimiento{--bc:var(--warn)} .banner.urgente{--bc:var(--crit)}
.banner .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--bc)}
.banner .t{font-weight:600}
.banner .m{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.banner .w{font-size:13px;font-weight:600;margin-top:2px}
/* Historial */
.log{width:100%;border-collapse:collapse;font-size:14px}
.log th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.log td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.log td.c{white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
/* Formularios */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(620px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow-y:auto}
dialog::backdrop{background:rgba(10,15,20,.5)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:18px;height:18px;flex:none}
/* Agenda: calendario (día, semana, mes, lista), tareas y notas, con un lateral de mes pequeño y categorías */
.ag{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.ag-main{min-width:0}
.ag-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px;min-width:0}
.ag-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ag-top .chips{margin:0}
.ag-top input{flex:1;min-width:180px;max-width:320px;margin-left:auto}
.ag-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ag-bar .ttl{font-family:var(--f-display);font-size:21px;margin-right:auto;min-width:0}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segc button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.segc button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.navb{all:unset;cursor:pointer;box-sizing:border-box;min-width:34px;height:34px;padding:0 10px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;font-weight:600}
.navb:hover{background:var(--surface-2)}
.agsync{font-size:12px;color:var(--muted)}
.notice{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.mgrid .dow{background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px}
.mday{cursor:pointer;background:var(--surface);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mday:hover{background:var(--surface-2)}
.mday.out{background:var(--surface-2)} .mday.out .dn{opacity:.45}
.mday .dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.mday.today .dn{background:var(--accent);color:var(--surface)}
.mday.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mday .fest{font-size:10px;color:var(--seal);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{--cc:var(--accent);all:unset;box-sizing:border-box;display:block;cursor:pointer;font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--cc) 16%,var(--surface));border-left:3px solid var(--cc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);max-width:100%}
.pill.task{background:transparent;border-left-style:dotted}
.pill.done{text-decoration:line-through;color:var(--muted)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cc)}
.tg{--hh:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tg-h,.tg-all,.tg-g{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}
.tg-h{border-bottom:1px solid var(--line)}
.tg-h>div{padding:8px 4px;font-size:12px;color:var(--muted);text-align:center;min-width:0;border-left:1px solid var(--line);text-transform:capitalize}
.tg-h>div:first-child,.tg-all>div:first-child{border-left:0}
.tg-h b{display:block;font-size:20px;font-family:var(--f-display);color:var(--ink);font-weight:600;line-height:1.2}
.tg-h .today b{color:var(--accent)}
.tg-h .fest{display:block;color:var(--seal);font-size:10px;font-weight:600;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-all{border-bottom:1px solid var(--line);min-height:30px}
.tg-all>div{padding:3px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tg-all>div:first-child{font-size:10px;color:var(--muted);text-align:right;padding:6px 6px 0 0;line-height:1.2}
.tg-b{height:min(660px,calc(100vh - 290px));min-height:360px;overflow-y:auto;position:relative}
.tg-g{position:relative;height:calc(24 * var(--hh))}
.tg-hours div{height:var(--hh);font-size:10px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px);font-family:var(--f-mono)}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh));cursor:copy}
.tg-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.ev{--cc:var(--accent);all:unset;box-sizing:border-box;position:absolute;cursor:pointer;border-radius:5px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--cc) 22%,var(--surface));border-left:3px solid var(--cc);color:var(--ink);z-index:1}
.ev:hover{z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.al-day{margin-bottom:18px}
.al-day h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.al-day h3.today{color:var(--accent)}
.al-day h3 .f{color:var(--seal);text-transform:none;letter-spacing:0}
.it{--cc:var(--accent);all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:8px;margin-bottom:6px}
.it:hover{background:var(--surface-2)}
.it .h{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.it .t{display:block;font-weight:600;overflow-wrap:anywhere}
.it .s{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 2px;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);cursor:pointer}

const agLocalKey=()=>"digesto-agenda-"+(ME?ME.id:"");

async function agLoad(){if(!ME)return;
 try{const {data,error}=await sb.from("digesto_agenda").select("data,updated_at").eq("user_id",ME.id).maybeSingle();if(error)throw error;
  AGM="nube";AGsync="Guardada en tu cuenta";
  if(data)AG=agNorm(data.data);
  else{const loc=agLocal();AG=agNorm(loc);if(loc){agDirty=true;await agPush();if(!agDirty)try{localStorage.removeItem(agLocalKey())}catch(e){}}}}
 catch(e){if(agMissing(e)){AGM="local";AG=agNorm(agLocal());AGsync="Guardada solo en este navegador"}
  else if(AG&&AGM){AGsync="Sin conexión"}else{AGM="error";AGsync="Sin conexión"}}}
function agChanged(){if(AGM==="local"){try{localStorage.setItem(agLocalKey(),JSON.stringify(AG))}catch(e){}return}

async function agPush(){if(AGM!=="nube"||!agDirty||!ME)return;agDirty=false;

 if(error){agDirty=true;AGsync="Sin conexión: se guardará al volver";clearTimeout(agT);agT=setTimeout(agPush,15000)}else AGsync="Guardada en tu cuenta";paintSync()}

/* Repeticiones y lo que cae en cada día */
function occurs(e,s){if(s<e.d||(e.until&&s>e.until)||e.ex.includes(s))return false;if(!e.rep)return s===e.d;const a=pd(e.d),b=pd(s);
 switch(e.rep){case "dia":return true;case "lab":{const w=b.getDay();return w>0&&w<6}case "sem":return a.getDay()===b.getDay();case "mes":return a.getDate()===b.getDate();
  case "tri":case "sem6":{const k=e.rep==="tri"?3:6,md=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();return md%k===0&&a.getDate()===b.getDate()}
  case "ano":return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()}return false}
const catOf=id=>AG.cats.find(c=>c.id===id)||AG.cats[0]||{id:"",c:AGCOL[0][0],n:"Sin categoría"};
const visCat=id=>!AGH.has(catOf(id).id);
const endM=e=>e.e&&mins(e.e)>mins(e.s)?mins(e.e):Math.min(mins(e.s)+60,1440);
const evOnAll=s=>AG.events.filter(e=>occurs(e,s)).sort((a,b)=>(b.all-a.all)||a.s.localeCompare(b.s));
const evOn=s=>evOnAll(s).filter(e=>visCat(e.cat)&&(!AGV.fcli||e.cli===AGV.fcli));
const tasksOn=s=>AG.tasks.filter(t=>t.due===s&&visCat(t.cat)&&(!AGV.fcli||t.cli===AGV.fcli));
const cliOf=id=>id&&AG.clients.find(c=>c.id===id)||null;
const cliSorted=()=>[...AG.clients].sort((a,b)=>a.n.localeCompare(b.n,"es"));
const cliOpts=sel=>`<option value="">Sin cliente</option>`+cliSorted().map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.n)}${c.emp&&c.emp!==c.n?" · "+esc(c.emp):""}</option>`).join("");
const estBdg=e=>e.kind==="visita"&&e.vis.est?`<span class="bdg ${e.vis.est==="resuelto"?"on":e.vis.est==="pendiente"?"unc":"off"}">${ESTN[e.vis.est]}</span>`:"";
const mapsUrl=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const telHref=t=>"tel:"+String(t).replace(/[^\d+]/g,"");
const isUrl=s=>/^https?:\/\//i.test(s||"");
const addrOf=e=>!isUrl(e.loc)&&e.loc?e.loc:(cliOf(e.cli)||{}).dir||"";
/* Eventos que se solapan: se reparten en columnas dentro del día */
function lay(L){const items=L.map(e=>({e,a:mins(e.s),b:endM(e)})).sort((x,y)=>x.a-y.a||y.b-x.b);const groups=[];let cur=[],end=-1;
 items.forEach(it=>{if(cur.length&&it.a>=end){groups.push(cur);cur=[];end=-1}cur.push(it);end=Math.max(end,it.b)});if(cur.length)groups.push(cur);
 groups.forEach(g=>{const cols=[];g.forEach(it=>{let c=cols.findIndex(x=>x<=it.a);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.b;it.c=c});g.forEach(it=>it.n=cols.length)});return items}

/* Piezas que se repiten en varias vistas */
const evTime=e=>e.all?"Todo el día":e.s+(e.e?"–"+e.e:"");
const evPill=(e,s)=>`<button class="pill" data-ev="${e.id}" data-on="${s}" style="--cc:${catOf(e.cat).c}" title="${esc(e.t)}">${e.all?"":e.s+" "}${esc(e.t)||"(sin título)"}</button>`;
const tkPill=t=>`<button class="pill task ${t.done?"done":""}" data-tk="${t.id}" style="--cc:${catOf(t.cat).c}" title="${esc(t.t)}">${t.done?"☑":"☐"} ${esc(t.t)}</button>`;
const itemEv=(e,s,withDate)=>{const c=cliOf(e.cli),sub=[e.kind&&KSHORT[e.kind],c&&esc(c.n),e.kind==="visita"&&e.vis.inc,e.loc&&esc(e.loc),e.rep&&REPN[e.rep],e.rem>=0&&"Con aviso"].filter(Boolean);
 return `<button class="it" data-ev="${e.id}" data-on="${s}" style="--cc:${catOf(e.cat).c}"><span class="h">${withDate?pd(s).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"2-digit"})+"<br>":""}${e.all?"Todo el día":e.s+(e.e&&!withDate?"<br>"+e.e:"")}</span><span><span class="t">${esc(e.t)||"(sin título)"} ${estBdg(e)}</span>${sub.length?`<span class="s">${sub.join(" · ")}</span>`:""}</span></button>`};
const itemTk=t=>`<button class="it" data-tk="${t.id}" style="--cc:${catOf(t.cat).c}"><span class="h">${t.done?"☑ Hecha":"☐ Tarea"}</span><span><span class="t" ${t.done?'style="text-decoration:line-through;color:var(--muted)"':""}>${esc(t.t)}</span><span class="s">Prioridad ${PRIN[t.pri].toLowerCase()} · ${esc(catOf(t.cat).n)}</span></span></button>`;
function dayBlock(s,showEmpty){const E=evOn(s),K=tasksOn(s),f=fest(s);if(!showEmpty&&!E.length&&!K.length&&!f)return "";
 return `<div class="al-day"><h3 class="${s===todayS()?"today":""}">${s===todayS()?"Hoy · ":""}${dLong(s)}${f?` <span class="f">· ${esc(f)}</span>`:""}</h3>${E.map(e=>itemEv(e,s)).join("")}${K.map(itemTk).join("")}${!E.length&&!K.length?`<div class="sub" style="padding:2px 0 4px">Libre.</div>`:""}</div>`}

/* Vistas del calendario */
function calTitle(){const d=pd(AGV.d);
 if(AGV.mode==="dia")return dLong(AGV.d)+(AGV.d===todayS()?" · hoy":"");
 if(AGV.mode==="mes")return cap(d.toLocaleDateString("es-ES",{month:"long",year:"numeric"}));
 if(AGV.mode==="lista")return "Desde el "+pd(AGV.d).toLocaleDateString("es-ES",{day:"numeric",month:"long"});
 const a=monday(AGV.d),b=addD(a,6),f=x=>pd(x).toLocaleDateString("es-ES",{day:"numeric",month:"short"});return `${f(a)} – ${f(b)} ${pd(b).getFullYear()}`}
function vMonth(){const d=pd(AGV.d),first=ymd(new Date(d.getFullYear(),d.getMonth(),1,12)),start=monday(first),mon=d.getMonth(),T=todayS();
 const dim=new Date(d.getFullYear(),mon+1,0).getDate(),rows=Math.ceil(((pd(first).getDay()+6)%7+dim)/7);
 let h=`<div class="mgrid">${["lun","mar","mié","jue","vie","sáb","dom"].map(x=>`<div class="dow">${x}</div>`).join("")}`;
 for(let i=0;i<rows*7;i++){const s=addD(start,i),E=evOn(s),K=tasksOn(s),f=fest(s),all=[...E.map(e=>evPill(e,s)),...K.map(tkPill)];
  h+=`<div class="mday ${pd(s).getMonth()!==mon?"out":""} ${s===T?"today":""} ${s===AGV.d?"sel":""} ${f?"hasf":""}" data-day="${s}" role="button" tabindex="0" aria-label="${dLong(s)}${f?", festivo: "+esc(f):""}${all.length?", "+all.length+(all.length===1?" cosa":" cosas"):""}"><span class="dn">${pd(s).getDate()}</span>${f?`<span class="fest">${esc(f)}</span>`:""}${all.slice(0,3).join("")}${all.length>3?`<span class="more">+${all.length-3} más</span>`:""}<span class="dots">${[...E,...K].slice(0,4).map(x=>`<i style="--cc:${catOf(x.cat).c}"></i>`).join("")}</span></div>`}
 return h+`</div>`+(mob()?`<div style="margin-top:16px">${dayBlock(AGV.d,true)}</div>`:"")}
function vGrid(days){const T=todayS(),now=new Date(),nm=now.getHours()*60+now.getMinutes();
 return `<div class="tg" style="--n:${days.length}"><div class="tg-h"><div></div>${days.map(s=>`<div class="${s===T?"today":""}">${pd(s).toLocaleDateString("es-ES",{weekday:"short"})}<b>${pd(s).getDate()}</b>${fest(s)?`<span class="fest" title="${esc(fest(s))}">${esc(fest(s))}</span>`:""}</div>`).join("")}</div>
 <div class="tg-all"><div>todo el día</div>${days.map(s=>`<div>${evOn(s).filter(e=>e.all).map(e=>evPill(e,s)).join("")}${tasksOn(s).map(tkPill).join("")}</div>`).join("")}</div>
 <div class="tg-b" id="tgb"><div class="tg-g"><div class="tg-hours">${[...Array(24)].map((_,i)=>`<div>${i?pad(i)+":00":""}</div>`).join("")}</div>
 ${days.map(s=>`<div class="tg-col ${s===T?"today":""}" data-col="${s}">${lay(evOn(s).filter(e=>!e.all)).map(it=>`<button class="ev" data-ev="${it.e.id}" data-on="${s}" style="--cc:${catOf(it.e.cat).c};top:calc(${it.a/60} * var(--hh));height:calc(${(it.b-it.a)/60} * var(--hh) - 2px);min-height:20px;left:calc(${it.c/it.n*100}% + 2px);width:calc(${100/it.n}% - 4px)" title="${esc(it.e.t)} · ${evTime(it.e)}"><b>${esc(it.e.t)||"(sin título)"}</b><span>${evTime(it.e)}</span>${cliOf(it.e.cli)?`<span> · ${esc(cliOf(it.e.cli).n)}</span>`:it.e.loc?`<span> · ${esc(it.e.loc)}</span>`:""}</button>`).join("")}${s===T?`<div class="now" style="top:calc(${nm/60} * var(--hh))"></div>`:""}</div>`).join("")}</div></div></div>`}
function vList(){let h="";for(let i=0;i<60;i++)h+=dayBlock(addD(AGV.d,i),i===0);return h||`<div class="panel empty">Nada en los próximos 60 días.</div>`}
function vCal(){const m=AGV.mode;
 const bar=`<div class="ag-bar"><span class="ttl">${calTitle()}</span><button class="navb" data-mv="0">Hoy</button><button class="navb" data-mv="-1" aria-label="Anterior">‹</button><button class="navb" data-mv="1" aria-label="Siguiente">›</button>
  <div class="segc" role="group" aria-label="Vista">${[["dia","Día"],["semana","Semana"],["mes","Mes"],["lista","Lista"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>
  ${AG.clients.length?`<select id="fCli" aria-label="Filtrar por cliente" style="width:auto;max-width:220px">${cliOpts(AGV.fcli).replace(">Sin cliente<",">Todos los clientes<")}</select>`:""}</div>`;
 if(m==="mes")return bar+vMonth();
 if(m==="lista")return bar+vList();
 if(m==="semana"){const a=monday(AGV.d),days=[...Array(7)].map((_,i)=>addD(a,i));return bar+(mob()?days.map(s=>dayBlock(s,true)).join(""):vGrid(days))}
 return bar+vGrid([AGV.d])}
function agMove(n){const m=AGV.mode;AGV.sc=null;
 AGV.d=n===0?todayS():m==="dia"?addD(AGV.d,n):m==="semana"?addD(AGV.d,7*n):m==="mes"?addM(AGV.d,n):addD(AGV.d,30*n);render()}

/* Tareas */
function tkFilters(){const T=todayS(),in7=addD(T,7);return {pend:["Pendientes",t=>!t.done],hoy:["Para hoy",t=>!t.done&&t.due===T],late:["Atrasadas",t=>!t.done&&t.due&&t.due<T],next:["Próximos 7 días",t=>!t.done&&t.due>T&&t.due<=in7],nodate:["Sin fecha",t=>!t.done&&!t.due],done:["Hechas",t=>t.done]}}
const tkRow=t=>{const late=!t.done&&t.due&&t.due<todayS();return `<div class="tk ${t.done?"done":""}"><input type="checkbox" data-tdone="${t.id}" ${t.done?"checked":""} aria-label="Marcar «${esc(t.t)}» como hecha"><div style="min-width:0"><div class="t" data-tk="${t.id}" role="button" tabindex="0">${esc(t.t)}</div><div class="s"><span><span class="cdot" style="--cc:${catOf(t.cat).c}"></span>${esc(catOf(t.cat).n)}</span>${cliOf(t.cli)?`<span>${esc(cliOf(t.cli).n)}</span>`:""}${t.due?`<span class="${late?"late":""}">${late?"Venció ":""}${dShort(t.due)}</span>`:""}${t.notes?"<span>Con notas</span>":""}</div></div><span class="pri p${t.pri}">${PRIN[t.pri]}</span></div>`};
function vTasks(){const FL=tkFilters(),vis=AG.tasks.filter(t=>visCat(t.cat)),f=FL[AGV.tf]||FL.pend;
 const L=vis.filter(f[1]).sort(AGV.tf==="done"?(a,b)=>b.doneAt.localeCompare(a.doneAt):(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||a.pri-b.pri||a.created.localeCompare(b.created));
 return `<div class="qadd"><input id="tQ" placeholder="Escribe una tarea y pulsa Intro" maxlength="200" aria-label="Nueva tarea rápida" autocomplete="off"><button class="btn" id="tQA">Añadir</button></div>
 <div class="chips">${Object.entries(FL).map(([k,[l,fn]])=>`<button class="chip" data-tf="${k}" aria-pressed="${AGV.tf===k}">${l} (${vis.filter(fn).length})</button>`).join("")}</div>
 <div class="panel" style="padding:8px 16px">${L.length?L.map(tkRow).join(""):`<div class="empty">${AGV.tf==="done"?"Aún no has terminado ninguna.":"Nada por aquí."}</div>`}</div>
 ${AGV.tf==="done"&&L.length?`<div style="margin-top:12px"><button class="btn ghost small danger" id="tClr">Borrar las tareas hechas</button></div>`:""}`}

/* Notas */
function vNotes(){const L=[...AG.notes].sort((a,b)=>(b.pin-a.pin)||b.upd.localeCompare(a.upd));
 return `<div class="toolbar"><button class="btn" id="nNew">Nueva nota</button></div><div class="notes">${L.map(n=>`<button class="note ${n.pin?"pin":""}" data-note="${n.id}"><span class="t">${n.pin?"★ ":""}${esc(noteTitle(n))}</span><span class="b">${esc(n.b)}</span><span class="f">${n.pin?"Fijada · ":""}${relT(n.upd)}</span></button>`).join("")}</div>${L.length?"":`<div class="panel empty">Sin notas todavía. Apunta ideas, actas de reuniones o lo que tengas pendiente de pensar.</div>`}`}

/* Tarjeta fija de notas: escribir rápido, ver las últimas y abrirlas para editarlas */
const noteTitle=n=>n.t||n.b.split("\n")[0].slice(0,80)||"Sin título";
function noteCard(){const L=[...AG.notes].sort((a,b)=>(b.pin-a.pin)||b.upd.localeCompare(a.upd)).slice(0,5);
 return `<div class="panel ncard"><div class="phead" style="margin-bottom:8px"><h2>Notas</h2>${AG.notes.length?`<button class="iconbtn" id="ncAll">Ver todas (${AG.notes.length})</button>`:""}</div>
  <textarea id="ncQ" rows="2" maxlength="5000" placeholder="Apunta algo rápido… La primera línea será el título." aria-label="Nota rápida"></textarea>
  <div class="hbtns" style="margin:8px 0 4px"><button class="btn small" id="ncAdd">Guardar nota</button><button class="btn ghost small" id="ncNew">Nota completa</button></div>
  ${L.map(n=>`<button class="nrow" data-note="${n.id}"><b>${n.pin?"★ ":""}${esc(noteTitle(n))}</b>${n.t&&n.b?`<span>${esc(n.b.slice(0,90))}</span>`:""}<small>${relT(n.upd)}</small></button>`).join("")||`<p class="sub" style="margin:6px 0 0">Aún no tienes notas.</p>`}</div>`}

/* Búsqueda en toda la agenda */
function vSearch(){const f=fold(AGV.q.trim());
 const E=AG.events.filter(e=>fold([e.t,e.loc,e.notes,(cliOf(e.cli)||{}).n,e.vis.inc,e.vis.prob,e.vis.diag,e.vis.sol,e.vis.mat,e.met.asis,e.met.puntos,e.met.acuerdos,e.met.pasos].join(" ")).includes(f)).sort((a,b)=>b.d.localeCompare(a.d));
 const K=AG.tasks.filter(t=>fold(t.t+" "+t.notes).includes(f)),N=AG.notes.filter(n=>fold(n.t+" "+n.b).includes(f));
 const C=AG.clients.filter(c=>fold([c.n,c.emp,c.con,c.tel,c.mail,c.dir,c.notas,...c.eq.map(q=>q.mod+" "+q.serie)].join(" ")).includes(f));
 if(!E.length&&!K.length&&!N.length&&!C.length)return `<div class="panel empty">Nada coincide con «${esc(AGV.q.trim())}».</div>`;
 return `${C.length?`<div class="al-day"><h3>Clientes (${C.length})</h3><div class="clis">${C.map(cliCard).join("")}</div></div>`:""}${E.length?`<div class="al-day"><h3>Eventos (${E.length})</h3>${E.map(e=>itemEv(e,e.d,true)).join("")}</div>`:""}
 ${K.length?`<div class="al-day"><h3>Tareas (${K.length})</h3>${K.map(itemTk).join("")}</div>`:""}
 ${N.length?`<div class="al-day"><h3>Notas (${N.length})</h3>${N.map(n=>`<button class="it" data-note="${n.id}" style="--cc:var(--gold)"><span class="h">Nota</span><span><span class="t">${esc(n.t)||"Sin título"}</span><span class="s">${esc(n.b.slice(0,140))}</span></span></button>`).join("")}</div>`:""}`}

/* Lateral: mes pequeño, categorías y herramientas */

 let mini="";for(let i=0;i<42;i++){const s=addD(start,i);const has=evOn(s).length||tasksOn(s).some(t=>!t.done);
  mini+=`<button data-mini="${s}" class="${pd(s).getMonth()!==mon?"out":""} ${s===T?"today":""} ${s===AGV.d?"sel":""} ${has?"has":""} ${fest(s)?"fest":""}" aria-label="${dLong(s)}${fest(s)?", festivo":""}">${pd(s).getDate()}</button>`}
 return `<div class="panel"><div class="mini-h"><button class="navb" data-mm="-1" aria-label="Mes anterior">‹</button><b>${cap(d.toLocaleDateString("es-ES",{month:"long",year:"numeric"}))}</b><button class="navb" data-mm="1" aria-label="Mes siguiente">›</button></div>
  <div class="mini">${["L","M","X","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}${mini}</div></div>
 ${noteCard()}
 <div class="panel"><div class="phead" style="margin-bottom:6px"><h2>Categorías</h2><button class="iconbtn" id="catEd">Editar</button></div>
  <div class="cats">${AG.cats.map(c=>`<button data-cat="${c.id}" aria-pressed="${!AGH.has(c.id)}" style="--cc:${c.c}"><i></i>${esc(c.n)}</button>`).join("")}</div>
  <p class="sub" style="margin:8px 0 0">Toca una para ocultarla o mostrarla.</p></div>
 <div class="panel tools"><h2>Herramientas</h2>

  <p class="sub" style="margin:4px 0 0">Los avisos suenan mientras tengas el panel abierto. Para avisos con el panel cerrado, exporta el .ics a tu calendario.</p>
  ${mob()?"":`<p class="sub" style="margin:4px 0 0">Atajos: <span class="kbd">N</span> evento · <span class="kbd">T</span> hoy · <span class="kbd">←</span> <span class="kbd">→</span> mover · <span class="kbd">D</span> <span class="kbd">S</span> <span class="kbd">M</span> <span class="kbd">L</span> vistas</p>`}</div>`}

function vAgenda(){
 if(!AG){main.innerHTML=`<div class="head"><div><div class="eyebrow">Agenda</div><h1>Tu agenda</h1></div></div><div class="panel empty">${AGM==="error"?"No se pudo cargar tu agenda. Revisa la conexión y vuelve a intentarlo.":"Cargando…"}</div>`;if(!AG&&ME&&!DATA.loading)agLoad().then(()=>{if(VIEW==="agenda"&&AG)render()});return}
 const T=todayS();
 main.innerHTML=`<div class="head"><div><div class="eyebrow">Agenda</div><h1>${dLong(T)}</h1><p><span id="agSync" class="agsync">${esc(AGsync)}</span></p></div>
  <div class="hbtns"><div class="newwrap"><button class="btn" id="agNew" aria-haspopup="menu" aria-expanded="false" aria-controls="agMenu">＋ Nuevo</button>
   <div class="newmenu" id="agMenu" role="menu" hidden>${[["visita","Visita de soporte","Con parte, firma y nº de incidencia"],["reunion","Reunión con cliente","Con acta y próximos pasos"],["llamada","Llamada","Para un cliente"],["evento","Evento","Cualquier otra cita"],null,["tarea","Tarea","Algo que hacer, con o sin fecha"],["nota","Nota","Una idea o un apunte rápido"],["cliente","Cliente","Ficha con teléfono y dirección"]].map(x=>x?`<button role="menuitem" data-new="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`:"<hr>").join("")}</div></div></div></div>
 ${runBanner()}
 ${AGM==="local"?`<div class="notice">Tu agenda se está guardando <b>solo en este navegador</b>. Ejecuta <b>supabase-agenda.sql</b> en Supabase para guardarla en tu cuenta y tenerla en todos tus dispositivos; lo que ya hayas apuntado se subirá solo.</div>`:""}
 <div class="ag-top"><div class="chips" role="tablist">${[["hoy","Hoy"],["cal","Calendario"],["clientes",`Clientes (${AG.clients.length})`],["tareas",`Tareas (${AG.tasks.filter(t=>!t.done).length})`],["notas",`Notas (${AG.notes.length})`],["horas","Horas"]].map(([k,l])=>`<button class="chip" data-tab="${k}" aria-pressed="${AGV.tab===k&&!AGV.q.trim()}">${l}</button>`).join("")}</div>
  <input id="agQ" type="search" placeholder="Buscar en la agenda…" aria-label="Buscar en la agenda" autocomplete="off" value="${esc(AGV.q)}"></div>
 <div class="ag"><div class="ag-main" id="agBody"></div><aside class="ag-side" id="agSide"></aside></div>`;
 /* Menú «＋ Nuevo»: todo lo que se puede crear, en un solo sitio */
 const nb=$("#agNew"),nm=$("#agMenu"),menu=open=>{nm.hidden=!open;nb.setAttribute("aria-expanded",String(open));if(open)nm.querySelector("button").focus()};
 nb.onclick=e=>{e.stopPropagation();menu(nm.hidden)};
 nm.onkeydown=e=>{if(e.key==="Escape"){menu(false);nb.focus()}};
 document.onclick=e=>{if(!nm.hidden&&!e.target.closest(".newwrap"))menu(false)};
 nm.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{menu(false);const k=b.dataset.new;
  k==="evento"?evForm():k==="tarea"?tkForm():k==="nota"?noteForm():k==="cliente"?cliForm():newKind(k)});

 footer{margin-top:28px;font-size:10px;color:#8a96a3;text-align:center}@page{margin:14mm}</style></head><body>${body}</body></html>`);d.close();
 const go=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast("No se pudo abrir la impresión en este navegador.")}setTimeout(()=>f.remove(),60000)};
 const imgs=[...d.images];Promise.all(imgs.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>setTimeout(go,150))}
function printEv(e,on){const c=cliOf(e.cli),v=e.vis,m=e.met,isV=e.kind==="visita",logo=new URL("icono-agenda.svg",location.href).href,br=x=>esc(x).replace(/\n/g,"<br>");
 const row=(l,x)=>x?`<tr><th>${l}</th><td>${br(x)}</td></tr>`:"",day=on||e.d;
 const dm=isV&&v.lleg&&v.sal&&mins(v.sal)>mins(v.lleg)?mins(v.sal)-mins(v.lleg):0;
 const body=`<header><img src="${logo}" width="46" height="46" alt=""><div><div class="k">${isV?"Parte de trabajo":"Acta de reunión"}</div><h1>${esc(e.t)}</h1></div>${isV&&v.inc?`<div class="inc">${esc(v.inc)}</div>`:""}</header>
 <table>${row("Fecha",cap(pd(day).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})))}${isV?row("Llegada",v.lleg)+row("Salida",v.sal)+row("Duración",dm?(dm>=60?Math.floor(dm/60)+" h ":"")+dm%60+" min":"")+row("Kilómetros",v.km?nf(v.km)+" km":""):row("Hora",evTime(e))}${row("Lugar",addrOf(e)||e.loc)}${row(isV?"Técnico":"Organiza",ME?ME.email:"")}</table>
 ${c?`<h2>Cliente</h2><table>${row("Nombre",c.n)}${row("Empresa",c.emp!==c.n?c.emp:"")}${row("Contacto",c.con)}${row("Teléfono",c.tel)}${row("Correo",c.mail)}${row("Dirección",c.dir)}</table>`:""}
 ${isV?`<h2>Trabajo realizado</h2><table>${row("Problema",v.prob)}${row("Diagnóstico",v.diag)}${row("Solución",v.sol)}${row("Material",v.mat)}${row("Estado",v.est?ESTN[v.est]:"")}</table>
  ${v.chk.length?`<h2>Lista de comprobación</h2><ul>${v.chk.map(x=>`<li>${x.ok?"☑":"☐"} ${esc(x.t)}</li>`).join("")}</ul>`:""}
  ${e.notes?`<h2>Observaciones</h2><p>${br(e.notes)}</p>`:""}
  <div class="firmas"><div><div class="fl">Firma del cliente</div>${v.firma?`<img src="${v.firma}" alt="Firma del cliente">`:`<div class="fb"></div>`}<div class="fn">${esc(v.firmante)}</div></div><div><div class="fl">Firma del técnico</div><div class="fb"></div></div></div>`
 :`<h2>Acta</h2><table>${row("Asistentes",m.asis)}${row("Puntos tratados",m.puntos)}${row("Acuerdos",m.acuerdos)}${row("Próximos pasos",m.pasos)}</table>${e.notes?`<h2>Observaciones</h2><p>${br(e.notes)}</p>`:""}`}
 <footer>Documento generado con Agenda Firztnet el ${new Date().toLocaleString("es-ES")}</footer>`;
 printDoc((isV?"Parte "+(v.inc||""):"Acta")+" - "+(c?c.n:e.t),body)}

/* ---------- PLANTILLAS de listas de comprobación ---------- */
function tplForm(){let L=AG.tpls.map(t=>({...t,items:[...t.items]}));
 const paint=()=>{F.innerHTML=`<h2 style="margin-bottom:6px">Plantillas de comprobación</h2><p class="sub" style="margin:0 0 14px">Listas que añades al parte de una visita con un toque. Un punto por línea.</p>
  ${L.map((t,i)=>`<div class="panel" style="padding:12px;margin-bottom:10px"><div class="row2"><input data-tn="${i}" value="${esc(t.n)}" maxlength="80" aria-label="Nombre de la plantilla"><button type="button" class="iconbtn" data-tdel="${i}">Borrar</button></div><textarea data-ti="${i}" style="margin-top:8px;min-height:110px" aria-label="Puntos de la plantilla">${esc(t.items.join("\n"))}</textarea></div>`).join("")}
  <button type="button" class="linkbtn" id="tAdd">Añadir plantilla</button>
  <div class="form"><div class="actions"><button type="button" class="btn ghost" id="tCan">Cancelar</button><button type="button" class="btn" id="tOk">Guardar</button></div></div>`;
  F.querySelectorAll("[data-tn]").forEach(i=>i.oninput=()=>L[+i.dataset.tn].n=i.value);
  F.querySelectorAll("[data-ti]").forEach(i=>i.oninput=()=>L[+i.dataset.ti].items=i.value.split("\n"));
  F.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{L.splice(+b.dataset.tdel,1);paint()});
  $("#tAdd").onclick=()=>{L.push({id:uid(),n:"Nueva plantilla",items:[]});paint();const ins=F.querySelectorAll("[data-tn]");ins[ins.length-1].select()};
  $("#tCan").onclick=()=>dlg.close();
  $("#tOk").onclick=()=>{AG.tpls=L.map(t=>({...t,n:t.n.trim()||"Plantilla",items:t.items.map(x=>x.trim()).filter(Boolean)}));dlg.close();agChanged();toast("Plantillas guardadas.")}};
 F.onsubmit=e=>e.preventDefault();paint();openDlg();dlg.scrollTop=0}

/* Eventos de las vistas nuevas */
function bindPro(root){
 const bindCli=()=>root.querySelectorAll("[data-cli]").forEach(b=>b.onclick=()=>{AGV.tab="clientes";AGV.q="";AGV.cli=b.dataset.cli;render();window.scrollTo(0,0)});bindCli();
 const cq=$("#cliQ");if(cq)cq.oninput=()=>{AGV.cq=cq.value;$("#cliList").innerHTML=cliList();bindCli()};
 const cn=$("#cliNew");if(cn)cn.onclick=()=>cliForm();
 const cb=$("#cliBack");if(cb)cb.onclick=()=>{AGV.cli="";paintAg();window.scrollTo(0,0)};
 const c=AGV.cli&&cliOf(AGV.cli);
 const ce=$("#cliEd");if(ce&&c)ce.onclick=()=>cliForm(c);
 const ct=$("#cliTk");if(ct&&c)ct.onclick=()=>tkForm(null,{cli:c.id,cat:catFor("visita")});
 const en=$("#eqNew");if(en&&c)en.onclick=()=>eqForm(c);
 root.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>eqForm(c,c.eq.find(q=>q.id===b.dataset.eq)));
 root.querySelectorAll("[data-newk]").forEach(b=>b.onclick=()=>newKind(b.dataset.newk));
 root.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startRun(b.dataset.start,b.dataset.on));
 root.querySelectorAll("[data-stop]").forEach(b=>b.onclick=stopRun);
 root.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{const n=+b.dataset.rd;AGV.rd=n?addD(AGV.rd||todayS(),n):"";paintAg()});
 root.querySelectorAll("[data-hm]").forEach(b=>b.onclick=()=>{const n=+b.dataset.hm;AGV.hm=n?addM((AGV.hm||todayS().slice(0,7))+"-01",n).slice(0,7):"";paintAg()});
 const hc=$("#hCsv2");if(hc)hc.onclick=hoursCsv;
 [["cfR","rate"],["cfK","kmRate"]].forEach(([id,k])=>{const i=$("#"+id);if(i)i.onchange=()=>{AG.cfg[k]=Math.max(0,+i.value||0);agChanged();paintAg()}});
 const fc=$("#fCli");if(fc)fc.onchange=()=>{AGV.fcli=fc.value;paintAg()}}

/* Avisos: se comprueban cada 30 segundos mientras el panel está abierto */
const fired=new Set();
function agTick(){if(!AG||!ME)return;document.querySelectorAll(".runT").forEach(x=>x.textContent=elapsed());const now=new Date(),T=ymd(now),nm=now.getHours()*60+now.getMinutes();
 [T,addD(T,1)].forEach((s,k)=>evOnAll(s).forEach(e=>{if(e.rem<0)return;const start=(e.all?9*60:mins(e.s))+k*1440,key=e.id+s;
  if(nm>=start-e.rem&&nm<=start&&!fired.has(key)){fired.add(key);const msg=`${e.t} · ${k?"mañana":"hoy"}${e.all?"":" a las "+e.s}${e.loc?" · "+e.loc:""}`;
   toast("Recordatorio: "+msg);if(window.Notification&&Notification.permission==="granted")try{new Notification("Agenda Firztnet",{body:msg,tag:key})}catch(x){}}}))}
setInterval(agTick,30000);
document.addEventListener("keydown",e=>{if(VIEW!=="agenda"||!AG||dlg.open||e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName||""))return;
 const k=e.key.toLowerCase();
 if(k==="n"){e.preventDefault();evForm()}
 else if(AGV.tab!=="cal"||AGV.q.trim())return;
 else if(k==="t")agMove(0);
 else if(k==="arrowleft"||k==="arrowright")agMove(k==="arrowleft"?-1:1);
 else if({d:"dia",s:"semana",m:"mes",l:"lista"}[k]){AGV.mode={d:"dia",s:"semana",m:"mes",l:"lista"}[k];AGV.sc=null;render()}});
matchMedia("(max-width:820px)").addEventListener("change",()=>{if(VIEW==="agenda"&&AG&&!dlg.open)render()});

/* ---------- CONFIRMACIONES ---------- */
function confirmBox(msg,okLabel,yes){F.onsubmit=e=>e.preventDefault();
 F.innerHTML=`<h2 style="margin-bottom:10px">¿Seguro?</h2><p style="margin:0 0 6px">${esc(msg)}</p><div class="form"><div class="actions"><button type="button" class="btn ghost" id="kNo">Cancelar</button><button type="button" class="btn" id="kYes">${esc(okLabel)}</button></div></div>`;
 $("#kNo").onclick=()=>dlg.close();$("#kYes").onclick=()=>{dlg.close();yes()};openDlg()}

/* ---------- ARRANQUE ---------- */
VIEW=(location.hash||"").slice(1)||"agenda";
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session)return enter(data.session)}catch(e){}showLogin("")})();
/* Cada dos minutos se refresca todo, salvo si estás escribiendo o con un formulario abierto */
const busy=()=>dlg.open||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName||"");
setInterval(()=>{if(ME&&!document.hidden&&!busy())loadAll()},120000);
document.addEventListener("visibilitychange",()=>{if(!ME)return;if(document.hidden){if(agDirty){clearTimeout(agT);agPush()}}else if(!busy())loadAll()});
</script>
