<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex,nofollow">
<title>Digesto de Derecho y RRII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: barra lateral de secciones (barra inferior en móvil) + área de trabajo; "Hoy" abre con el siguiente paso, la máxima del día y el plan hasta el examen */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d9dfe6;
  --ink:#16202c; --muted:#5d6b7a; --accent:#1f4e79; --accent-soft:#e1eaf3;
  --seal:#8a2b3a; --gold:#86610f;
  --ok:#2f7a4f; --warn:#96560a; --crit:#b3312f;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --gold:#d8b25a; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --gold:#d8b25a; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; color-scheme:dark}
/* Tema rosa: claro y con más color. Se activa desde Ajustes junto con data-theme="light" */
:root[data-skin="rosa"]{
  --bg:#fdf1f5; --surface:#ffffff; --surface-2:#fbe8ef; --line:#f1cfdc;
  --ink:#3a1f2d; --muted:#7a5562; --accent:#b0286a; --accent-soft:#fbdcea;
  --seal:#7c3aad; --gold:#8f5c10;
  --ok:#15755e; --warn:#a3500e; --crit:#c22643; color-scheme:light}
:root[data-skin="rosa"] body{background:#fdf1f5}
:root[data-skin="rosa"] body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background:linear-gradient(160deg,#fde9f1 0%,#f8eefb 55%,#eef2ff 100%)}
:root[data-skin="rosa"] .topbar{background:#fde9f1}
/* Tema gamer: negro profundo, neón cian y magenta, brillo en bordes y letra técnica. Va con data-theme="dark" */
:root[data-skin="gamer"]{
  --bg:#07070f; --surface:#10111f; --surface-2:#171930; --line:#2a2d55;
  --ink:#eef0ff; --muted:#9aa0c7; --accent:#22e3ff; --accent-soft:#0f2a44;
  --seal:#ff3df2; --gold:#ffd23f;
  --ok:#39ff88; --warn:#ffb020; --crit:#ff4d6d;
  --f-display:"Chakra Petch","Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px; color-scheme:dark}
:root[data-skin="gamer"] body{background:#07070f}
:root[data-skin="gamer"] body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;
  background:radial-gradient(900px 520px at 88% -10%,rgba(255,61,242,.15),transparent 60%),radial-gradient(820px 520px at 0% 0%,rgba(34,227,255,.13),transparent 60%),
  linear-gradient(rgba(34,227,255,.045) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(34,227,255,.045) 1px,transparent 1px) 0 0/32px 100%}
:root[data-skin="gamer"] h1{font-weight:600}
:root[data-skin="gamer"] h2{font-size:17px;text-transform:uppercase;letter-spacing:.06em}
:root[data-skin="gamer"] .brand,:root[data-skin="gamer"] .topbar{text-transform:uppercase;letter-spacing:.1em;font-weight:700}
:root[data-skin="gamer"] .topbar{background:#07070f;border-bottom-color:var(--accent);box-shadow:0 0 20px -6px var(--accent)}
:root[data-skin="gamer"] .btn{border-radius:6px}
:root[data-skin="gamer"] .btn:not(.ghost):not(.miss){box-shadow:0 0 16px -3px var(--accent);text-transform:uppercase;letter-spacing:.05em;font-size:13px}
:root[data-skin="gamer"] .btn.good{box-shadow:0 0 16px -3px var(--ok)}
:root[data-skin="gamer"] .panel,:root[data-skin="gamer"] .stat,:root[data-skin="gamer"] .subj,:root[data-skin="gamer"] .link,:root[data-skin="gamer"] .maxim,:root[data-skin="gamer"] .gate-card{background:linear-gradient(180deg,var(--surface),#0b0c19)}
:root[data-skin="gamer"] .stat b,:root[data-skin="gamer"] .pomo .time,:root[data-skin="gamer"] .duebox b{color:var(--accent);text-shadow:0 0 16px rgba(34,227,255,.55)}
:root[data-skin="gamer"] button.stat.hot b{color:var(--seal);text-shadow:0 0 16px rgba(255,61,242,.55)}
:root[data-skin="gamer"] .bar{height:8px;border-radius:2px;background:#0a0b17;border:1px solid var(--line)}
:root[data-skin="gamer"] .bar i{background:linear-gradient(90deg,var(--accent),var(--seal));box-shadow:0 0 10px var(--accent)}
:root[data-skin="gamer"] .week .col i{background:linear-gradient(0deg,var(--accent),var(--seal))}
:root[data-skin="gamer"] nav button[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--accent),0 0 14px -4px var(--accent)}
:root[data-skin="gamer"] .acard{border-color:var(--accent);background:linear-gradient(150deg,#14162e,#0a0b18)}
:root[data-skin="gamer"] .acard.warm{border-color:var(--warn)} :root[data-skin="gamer"] .acard.hot{border-color:var(--crit)}
:root[data-skin="gamer"] .acard .num{box-shadow:0 0 22px -2px var(--accent)}
:root[data-skin="gamer"] .acard.warm .num{box-shadow:0 0 22px -2px var(--warn)}
:root[data-skin="gamer"] .acard.hot .num{box-shadow:0 0 22px -2px var(--crit)}
:root[data-skin="gamer"] .seal{box-shadow:0 0 16px -2px var(--seal),inset 0 0 10px -4px var(--seal)}
:root[data-skin="gamer"] .bell,:root[data-skin="gamer"] .burger{box-shadow:0 0 12px -4px var(--accent)}
:root[data-skin="gamer"] .home{box-shadow:0 0 12px -3px var(--seal)}
:root[data-skin="gamer"] .cd.hoy,:root[data-skin="gamer"] .th[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent),0 0 12px -2px var(--accent)}
:root[data-skin="gamer"] .status.dominado{box-shadow:0 0 8px var(--ok)}
:root[data-skin="gamer"] .maxim q{font-style:normal}
/* Sin barras de desplazamiento a la vista en la página ni en el menú lateral; se sigue desplazando igual */
html,body,aside{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,aside::-webkit-scrollbar{display:none;width:0;height:0}
:root{--t-ph:"Escribe aquí tus apuntes…";--t-legal:"Texto legal"}
:root[lang="en"]{--t-ph:"Write your notes here…";--t-legal:"Legal text"}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;-webkit-tap-highlight-color:transparent}
button,summary,a,select,label{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--f-display);font-size:22px;line-height:1.15;padding-inline:8px}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--surface-2);color:var(--ink)}
.nx{display:flex;align-items:center;gap:10px;min-width:0}
.ni{flex:none}
nav button.only-more{display:none}
.btn:active,.chip:active,.iconbtn:active,nav button:active,.mrow:active,.th:active,.cd:active,.slot:active{opacity:.75}
/* Hoja «Más» del móvil */
.mlist{display:flex;flex-direction:column}
.mrow{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-top:1px solid var(--line);color:var(--ink)}
.mrow:first-child{border-top:0}
.mrow b{display:block;font-weight:600}
.mrow small{display:block;color:var(--muted);font-size:13px}
.mrow.danger{color:var(--crit)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.count.due{color:var(--seal);font-weight:600}
.mini{all:unset;cursor:pointer;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);text-align:center}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
main:focus{outline:none}
main{padding-block:32px 64px;padding-inline:40px;min-width:0;max-width:1100px;width:100%}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn.good{background:var(--ok)}
.iconbtn{all:unset;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:13px;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.grid2>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{font-size:13px;color:var(--muted)}
/* Acceso: pantalla de usuario y contraseña */
.gate{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-inline:16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.gate-card h1{font-size:28px}
.gate-card p{margin:0}
.gate-card .seal{width:48px;height:48px;font-size:22px}
.ghead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:6px}
.pw{display:block;position:relative}
.pw input{padding-right:46px}
.pwbtn{all:unset;cursor:pointer;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.pwbtn:hover{color:var(--ink);background:var(--surface-2)}
.gerr{color:var(--crit);font-size:14px;font-weight:500;min-height:1.5em}
.gate-card details{font-size:14px;color:var(--muted)}
.gate-card details p{margin:8px 0 12px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12px;text-decoration:underline}
/* Bienvenida y avisos */
.welcome{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:24px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.welcome p{margin:0;max-width:62ch}
.welcome .addline{max-width:520px;flex-wrap:wrap}
.notice{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;color:var(--muted);font-size:14px}
/* Máxima */
.maxim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:20px}
.seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-style:italic}
.maxim q{font-family:var(--f-display);font-style:italic;font-size:26px;line-height:1.2;quotes:none;display:block}
.maxim p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
button.stat{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
button.stat.hot{border-color:var(--seal)} button.stat.hot b{color:var(--seal)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
/* Plan hasta el examen */
.plan{padding:12px 0;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}
.plan-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.plan-h .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.plan p{margin:8px 0 0;font-size:14px}
/* Listas */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.row .s{font-size:13px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row .acts{display:flex;gap:2px}
.group{margin-top:16px}
.group:first-of-type{margin-top:4px}
.date{width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.date b{display:block;font-family:var(--f-display);font-size:20px;line-height:1}
.date small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.examen{color:var(--crit)} .pill.entrega{color:var(--warn)} .pill.clase{color:var(--accent)} .pill.conferencia{color:var(--gold)} .pill.otro{color:var(--muted)} .pill.trabajo{color:var(--seal)} .pill.deporte{color:var(--ok)}
.examen{--tc:var(--crit)} .entrega{--tc:var(--warn)} .clase{--tc:var(--accent)} .conferencia{--tc:var(--gold)} .trabajo{--tc:var(--seal)} .deporte{--tc:var(--ok)} .otro{--tc:var(--muted)}
.soon{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.soon.hot{color:var(--crit)}
/* Campana de avisos */
.app{position:relative}
.bell{all:unset;cursor:pointer;position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);z-index:6}
.bell:hover{border-color:var(--accent);color:var(--accent)}
.bell.ring svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(14deg)}82%{transform:rotate(-12deg)}88%{transform:rotate(8deg)}94%{transform:rotate(-4deg)}}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:var(--surface);font-size:11px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.notif{position:absolute;top:72px;right:24px;width:min(360px,calc(100% - 32px));max-height:min(70vh,520px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:7;box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
.nrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.nrow:hover strong{color:var(--accent)}
.nrow.new strong::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-left:8px;vertical-align:middle}
/* Avisos de lo que se acerca: tarjetas con volumen, inclinadas en 3D */
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:28px;perspective:900px}
.acard{all:unset;cursor:pointer;box-sizing:border-box;position:relative;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:20px;border-radius:16px;min-width:0;
  background:linear-gradient(150deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  transform-style:preserve-3d;transform:rotateX(var(--rx,7deg)) rotateY(var(--ry,-9deg));transition:transform .2s ease;
  box-shadow:9px 11px 0 -1px var(--accent-soft),0 28px 30px -18px rgba(0,0,0,.45)}
.acard.warm{border-color:var(--warn)} .acard.hot{border-color:var(--crit)}
.acard .num{transform:translateZ(42px);width:76px;height:76px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent);color:var(--surface);box-shadow:0 12px 18px -10px rgba(0,0,0,.5)}
.acard.warm .num{background:var(--warn)} .acard.hot .num{background:var(--crit)}
.acard .num b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.acard .num b.w{font-size:17px}
:root[lang="en"] .acard .num b.w{font-size:13px;letter-spacing:-.01em}
.acard .num small{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.acard .txt{transform:translateZ(20px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;overflow-wrap:anywhere}
.acard .txt strong{font-family:var(--f-display);font-size:19px;line-height:1.2;font-weight:600}
.acard .tip{font-size:13px}
.acard:active{transform:rotateX(0) rotateY(0)}
/* Semana: horario fijo y eventos con fecha, día a día */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.wd{display:flex;flex-direction:column;gap:6px;min-width:0}
.wd-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wd-h b{font-family:var(--f-display);font-size:16px;letter-spacing:0;color:var(--ink)}
.wd.hoy .wd-h{color:var(--accent);border-color:var(--accent)} .wd.hoy .wd-h b{color:var(--accent)}
.wd-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;font-size:12px;line-height:1.3;padding:6px 8px;border-radius:6px;background:var(--surface-2);border:1px solid transparent;overflow-wrap:anywhere}
.slot:hover{border-color:var(--tc)}
.slot .st{display:block;font-family:var(--f-mono);font-size:10px;color:var(--tc)}
.slot.ev{background:transparent;border-color:var(--tc);font-weight:600}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.days{border:0;padding:0;margin:0;display:flex;gap:6px;flex-wrap:wrap}
.days legend{font-size:13px;font-weight:500;color:var(--muted);padding:0;margin-bottom:4px}
.days label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-transform:capitalize;color:var(--ink)}
/* Currículum: una hoja de papel, siempre clara, con columna lateral del color elegido */
.cv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.cv-sheet{--cva:#1f4e79;--f-display:"Newsreader",Georgia,"Times New Roman",serif;background:#fff;color:#1b2430;border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 40px -26px rgba(0,0,0,.45);display:grid;grid-template-columns:34% 1fr;min-width:0;font-size:13.5px;line-height:1.45;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-side{background:#eef2f7;background:color-mix(in srgb,var(--cva) 11%,#fff);padding:28px 22px;display:flex;flex-direction:column;gap:22px;min-width:0}
.cv-main{padding:32px 30px;display:flex;flex-direction:column;gap:22px;min-width:0}
.cv-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #fff;display:block}
.cv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cv-name{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:600;color:var(--cva);margin:0;overflow-wrap:anywhere}
.cv-title{font-size:15px;color:#4a5665;margin:6px 0 0}
.cv-h{font-family:var(--f-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--cva);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #c9d3df;border-bottom:1px solid color-mix(in srgb,var(--cva) 35%,#fff);padding-bottom:4px}
.cv-sheet p{margin:0 0 4px;overflow-wrap:anywhere}
.cv-item{margin-bottom:12px;break-inside:avoid;overflow-wrap:anywhere}
.cv-item b{display:block;font-size:14.5px}
.cv-item .meta{color:#4a5665;font-size:12.5px}
.cv-item ul{margin:4px 0 0;padding-left:18px}
.cv-chips{display:flex;flex-wrap:wrap;gap:6px}
.cv-chips span{border:1px solid #c9d3df;border:1px solid color-mix(in srgb,var(--cva) 45%,#fff);border-radius:99px;padding:2px 9px;font-size:12px}
.cv-ph{color:#7d8896;font-style:italic}
.cv-sheet .iconbtn{color:var(--cva);font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
.cv-sheet .iconbtn:hover{background:rgba(0,0,0,.07);color:var(--cva)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.check .status{margin:0;cursor:default}
.tips{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.tips li{margin-bottom:6px}
@media screen and (max-width:1080px){.cv-wrap{grid-template-columns:1fr}}
@media screen and (max-width:640px){
  .cv-sheet{grid-template-columns:1fr}
  .cv-side,.cv-main{padding:22px 18px}
  .cv-name{font-size:28px}
}
/* Al imprimir solo sale la hoja del currículum, en A4 */
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;background:#fff!important}
  aside,.burger,.home,.topbar,.scrim,.mini,.bell,.notif,.toast,.gate,dialog,.no-print{display:none!important}
  .app{display:block!important;min-height:0!important}
  main{padding:0!important;max-width:none!important}
  .cv-wrap{display:block!important}
  .cv-sheet{border:0!important;border-radius:0!important;box-shadow:none!important;min-height:297mm;font-size:10.5pt}
}
/* Calendario de mes con festivos */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding-bottom:4px}
.cd{all:unset;cursor:pointer;box-sizing:border-box;min-height:86px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;background:var(--surface)}
.cd:hover{border-color:var(--accent)}
.cd.out{opacity:.4}
.cd.finde .dn{color:var(--muted)}
.cd.fest{background:var(--surface-2);background:color-mix(in srgb,var(--seal) 12%,var(--surface))}
.cd.fest .dn{color:var(--seal)}
.cd.hoy{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dn{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.fn{display:block;font-size:10px;line-height:1.2;color:var(--seal);font-weight:600;letter-spacing:0;text-transform:none;overflow-wrap:anywhere}
.cdots{display:flex;gap:4px;flex-wrap:wrap;padding:1px}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.cdots i.e{outline:1.5px solid var(--tc);outline-offset:1px}
.cev{display:block;font-size:10.5px;line-height:1.25;border:1px solid var(--tc);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{flex-wrap:wrap;align-items:center}
@media (max-width:820px){
  .cal{gap:3px}
  .cd{min-height:50px;padding:5px 2px;align-items:center}
  .cd .fn,.cev{display:none}
  .cdots{justify-content:center;gap:3px}
  .cdots i{width:5px;height:5px}
}
/* Apariencia: tres temas con su muestra */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.th{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px;min-width:0}
.th[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.th .pv{height:46px;border-radius:7px;border:1px solid rgba(0,0,0,.12);display:flex;align-items:flex-end;gap:5px;padding:7px}
.th .pv i{display:block;height:14px;border-radius:4px;flex:1}
.th .pv i:last-child{flex:0 0 14px;border-radius:50%}
/* Temas */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.subj-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.area{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.area.Derecho{color:var(--seal)} .area.RRII{color:var(--accent)}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.status{all:unset;cursor:pointer;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);margin-top:4px;flex:none;position:relative}
button.status::after{content:"";position:absolute;inset:-13px}
.status.curso{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.status.dominado{border-color:var(--ok);background:var(--ok)}
.topic .n{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .status{margin:0;cursor:default}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0}
.subj-foot{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
/* Apuntes de un tema: barra de formato y texto con títulos, listas, casillas, citas y texto legal */
.tlink{all:unset;cursor:pointer;display:block;overflow-wrap:anywhere}
.tlink:hover{color:var(--accent);text-decoration:underline}
.btn .status{display:inline-block;margin:0 6px -1px 0}
.tb{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:4;display:flex;gap:2px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:12px}
.tb button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
.tb button:hover{background:var(--surface-2)}
.tb button:active{opacity:.7}
.tb .sep{flex:none;align-self:stretch;width:1px;background:var(--line);margin:4px 4px}
.tb .mk{background:var(--accent);color:var(--surface);margin-left:auto}
.tb .mk:hover{background:var(--accent)}
.ed{min-height:46vh;outline:none;font-size:16px;line-height:1.65;max-width:74ch;overflow-wrap:anywhere}
.ed:empty::before{content:var(--t-ph);color:var(--muted)}
.ed>*:first-child{margin-top:0}
.ed p{margin:0 0 10px}
.ed h2{font-size:24px;margin:22px 0 8px}
.ed h3{font-family:var(--f-body);font-size:17px;font-weight:600;margin:18px 0 6px}
.ed ul,.ed ol{margin:0 0 10px;padding-left:24px}
.ed li{margin-bottom:4px}
.ed blockquote{margin:12px 0;padding:2px 0 2px 16px;border-left:3px solid var(--line);color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:18px}
.ed pre{white-space:pre-wrap;font-family:var(--f-display);font-size:17px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;margin:12px 0}
.ed pre::before{content:var(--t-legal);display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--seal);margin-bottom:4px}
.ed mark{background:rgba(232,182,40,.4);color:inherit;border-radius:3px;padding:0 2px}
.ed ul.chk{list-style:none;padding-left:0}
.ed ul.chk>li{position:relative;padding-left:30px}
.ed ul.chk>li::before{content:"";position:absolute;left:2px;top:.22em;width:18px;height:18px;box-sizing:border-box;border:2px solid var(--muted);border-radius:5px;cursor:pointer}
.ed ul.chk>li.done{color:var(--muted);text-decoration:line-through}
.ed ul.chk>li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--surface);font-size:13px;line-height:14px;text-align:center;text-decoration:none}
@media (max-width:820px){
  .tb{top:calc(52px + env(safe-area-inset-top,0px));flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 12px;border-radius:0;border-width:1px 0;padding:6px 12px}
  .tb::-webkit-scrollbar{display:none}
  .tb button{padding:10px 12px;font-size:14px}
  .tb .mk{margin-left:4px}
  .ed{min-height:50vh}
  .ed h2{font-size:22px}
}
/* Buscador, página de asignatura y plantillas */
#searchBtn{right:76px}
#langBtn{right:128px;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.06em}
#helpBtn{right:180px;font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1}
/* Ayuda */
.hsec summary{font-family:var(--f-display);font-size:19px}
.hsec p{margin:10px 0 8px;max-width:68ch}
.hsec .tips{margin-bottom:12px;max-width:68ch}
.hsec .tips li{color:var(--ink);font-size:15px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .status{margin:0;cursor:default;width:18px;height:18px}
.step b{display:block}
.step.ok b{color:var(--muted)}
@media (max-width:560px){.step{grid-template-columns:auto 1fr}.step .btn{grid-column:2;justify-self:start}}
.sres .panel{margin-bottom:16px}
.sres h2 .sub{font-family:var(--f-body);font-weight:400;letter-spacing:0;text-transform:none}
.tplbox{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.tplbox .hbtns .btn{flex:0 1 auto}
.mini-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.mini-row:first-of-type{border-top:0}
.mini-row a{color:var(--accent);font-weight:600;text-decoration:none;word-break:break-word;overflow-wrap:anywhere}
@media (max-width:820px){
  #searchBtn{right:60px}
  #langBtn{right:108px}
  #helpBtn{right:156px}
  .topbar{padding-right:208px}
  .topbar small{display:none}
}
/* Hitos: línea del tiempo de lo que cambió el derecho y el orden internacional */
.k-tratado{--tc:var(--accent)} .k-conflicto{--tc:var(--crit)} .k-sentencia{--tc:var(--seal)} .k-poder{--tc:var(--gold)} .k-derechos{--tc:var(--ok)} .k-espana{--tc:var(--warn)}
.pill[class*="k-"]{color:var(--tc)}
.hchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.era{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 12px}
.hrow{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;width:100%}
.hy{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2;text-align:right;font-variant-numeric:tabular-nums}
.hb{position:relative;border-left:2px solid var(--line);padding:0 0 24px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;overflow-wrap:anywhere}
.hb::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:var(--bg);border:3px solid var(--tc)}
.hb strong{font-family:var(--f-display);font-size:19px;line-height:1.25;font-weight:600}
.hrow:hover .hb strong{color:var(--accent)}
.hito h2{margin:20px 0 6px}
.hito h2:first-child{margin-top:0}
.hito p{margin:0;max-width:70ch;font-size:16px;line-height:1.6}
.legal{font-family:var(--f-display);font-size:17px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:70ch}
@media (max-width:820px){
  .hchips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .hchips::-webkit-scrollbar{display:none}
  .hchips .chip{white-space:nowrap;flex:none}
  .hrow{grid-template-columns:46px minmax(0,1fr);gap:10px}
  .hy{font-size:17px}
  .hb{padding-left:18px}
  .hb strong{font-size:18px}
}
/* Modo ejemplo: franja fija en cada pantalla mientras se mira la muestra */
.demo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-size:14px}
.wipe{display:flex;flex-direction:column;gap:2px;margin:4px 0 8px}
.wipe label{flex-direction:row;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);color:var(--ink);font-size:15px;font-weight:400}
.wipe label:first-child{border-top:0}
/* Calificaciones: barra de 0 a 10 con lo acumulado y una marca en el objetivo */
.gbar{position:relative;height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;margin:14px 0 22px}
.gbar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.gbar i.low{background:var(--warn)}
.gbar .gt{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.gbar .gl{position:absolute;top:14px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.gbig{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.grow .gs{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:44px;text-align:right}
.grow .gw{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:38px;text-align:right}
.ghead2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ghead2 select{width:auto}
/* Simulacro de examen */
.mclock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.mclock.hot{color:var(--crit);border-color:var(--crit)}
.mfail{padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.mfail:first-of-type{border-top:0}
@media (max-width:560px){.grow{grid-template-columns:minmax(0,1fr) auto auto}.grow .iconbtn{grid-column:1/-1;justify-self:start;margin:-6px 0 0 -6px}}
/* Comunicados de la administración: arriba en cada pantalla y en el acceso */
.annc-bar{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.annc{--bc:var(--accent);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--bc);border-left-width:4px;background:color-mix(in srgb,var(--bc) 10%,var(--surface));border-radius:var(--r);padding:12px 14px;text-align:left}
.annc.mantenimiento{--bc:var(--warn)} .annc.urgente{--bc:var(--crit)}
.annc>div{min-width:0;flex:1 1 220px}
.annc-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--bc)}
.annc-t{font-weight:600}
.annc-m{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.annc-w{font-size:13px;font-weight:600;margin-top:2px}
.gate-card .annc{font-size:14px}
/* Enlaces y fichas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:auto;max-width:100%}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.link a{color:var(--accent);font-weight:600;text-decoration:none;word-break:break-word;overflow-wrap:anywhere}
.link a:hover{text-decoration:underline}
.link .dom{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.link .note{font-size:14px;border-left:2px solid var(--gold);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.link .q{font-weight:600;overflow-wrap:anywhere}
.link .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
details.panel{margin-bottom:16px;padding:14px 20px}
details summary{cursor:pointer;font-weight:600}
.src{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.src:first-of-type{margin-top:12px}
.src a{color:var(--accent);font-weight:600;text-decoration:none}
.duebox{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.duebox b{font-family:var(--f-display);font-size:24px;font-weight:600}
/* Repaso de fichas */
.review{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;min-height:240px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.card .cq{font-family:var(--f-display);font-size:26px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.card .ca{border-top:1px solid var(--line);padding-top:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.review .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review .ctrl .btn{flex:1;max-width:220px}
.btn.miss{background:transparent;color:var(--crit);border:1px solid var(--crit)}
/* Formularios */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Añade a cada campo de contraseña un botón para verla u ocultarla */
function pwToggles(root){root.querySelectorAll('input[type="password"]').forEach(inp=>{
 const w=document.createElement("span");w.className="pw";inp.before(w);w.append(inp);
 const b=document.createElement("button");b.type="button";b.className="pwbtn";b.innerHTML=ico("ojo");b.setAttribute("aria-label","Ver la contraseña");b.setAttribute("aria-pressed","false");
 b.onclick=()=>{const show=inp.type==="password";inp.type=show?"text":"password";b.innerHTML=ico(show?"ojono":"ojo");b.setAttribute("aria-label",show?"Ocultar la contraseña":"Ver la contraseña");b.setAttribute("aria-pressed",String(show));inp.focus()};
 w.append(b)})}

"Tu portada: lo que toca hoy y cómo vas.":"Your front page: what's on today and how you're doing.","Las tarjetas de arriba avisan de las fechas que se acercan. Tócalas para ir a la Agenda.":"The cards at the top warn you about upcoming dates. Tap them to go to the Planner.","«Tu día» muestra tus clases y compromisos de hoy y tu mejor hueco para estudiar.":"“Your day” shows today's classes and commitments and your best slot to study.","«Plan hasta el examen» calcula cuántos temas te quedan y a qué ritmo llegar.":"“Plan until the exam” works out how many topics you have left and the pace to get there.","El temporizador cuenta sesiones de 25 o 50 minutos. Al terminar suma los minutos a tu semana y el día cuenta para tu racha.":"The timer runs 25- or 50-minute sessions. When it ends it adds the minutes to your week and the day counts for your streak.","El botón «Currículum» abre tu CV.":"The “CV” button opens your CV.",
"Temas y asignaturas":"Topics and subjects","El temario de cada asignatura y lo que ya dominas.":"Each subject's syllabus and what you've already mastered.","Crea una asignatura con «Nueva asignatura» y añade sus temas.":"Create a subject with “New subject” and add its topics.","Toca el círculo de un tema para cambiar su estado: pendiente, en curso o dominado.":"Tap a topic's circle to change its status: to do, in progress or mastered.","Toca el nombre de un tema para abrir sus apuntes.":"Tap a topic's name to open its notes.","Toca el nombre de la asignatura para ver todo lo suyo en una página: temas, fichas, fechas, clases, enlaces e hitos.":"Tap the subject's name to see everything about it on one page: topics, flashcards, dates, classes, links and milestones.","El porcentaje de «temario dominado» de Hoy sale de aquí.":"Today's “syllabus mastered” percentage comes from here.",
"Apuntes de un tema":"A topic's notes","La página donde escribes cada tema.":"The page where you write each topic.","Da formato con la barra: título, subtítulo, listas, casillas, cita, texto legal, negrita y resaltado.":"Format with the toolbar: heading, subheading, lists, checkboxes, quote, legal text, bold and highlight.","Se guarda solo mientras escribes. No hay botón de guardar.":"It saves as you type. There's no save button.","En un tema vacío puedes empezar con una plantilla: comentario de sentencia, tema de teoría, caso práctico o lectura de RRII.":"In an empty topic you can start with a template: case commentary, theory topic, practical case or IR reading.","Selecciona un texto y pulsa «Hacer ficha»: ese texto será la respuesta y tú escribes la pregunta.":"Select some text and tap “Make card”: that text becomes the answer and you write the question.","En una lista de casillas, toca el cuadrado para marcarla como hecha.":"In a checklist, tap the box to mark it done.",
"Fichas de repaso":"Flashcards","Preguntas y respuestas para memorizar sin releer.":"Questions and answers to memorise without rereading.","Crea una ficha con «Nueva ficha» o desde tus apuntes con «Hacer ficha».":"Create a card with “New flashcard” or from your notes with “Make card”.","«Repasar ahora» te pregunta las que tocan hoy. Intenta responder antes de mirar la respuesta.":"“Review now” asks you the ones due today. Try to answer before looking.","Si la sabías, la ficha sube de nivel y vuelve más tarde: al día siguiente, a los 3, 7, 14 y 30 días. Si no, vuelve mañana.":"If you knew it, the card levels up and comes back later: the next day, then after 3, 7, 14 and 30 days. If not, it comes back tomorrow.","«Practicar todas» sirve para la víspera del examen y no cambia las fechas de repaso.":"“Practise all” is for the night before the exam and doesn't change review dates.","Terminar un repaso cuenta como día estudiado.":"Finishing a review counts as a study day.","«Simulacro de examen» te pregunta fichas al azar con tiempo y te pone nota sobre 10. No cambia las fechas de repaso.":"“Mock exam” asks you random cards against the clock and gives you a mark out of 10. It doesn't change review dates.",
"Tus notas y lo que necesitas sacar en lo que queda.":"Your grades and what you need in what's left.","Apunta cada examen, parcial o trabajo con «Nueva calificación», con su asignatura y el porcentaje que vale.":"Record each exam, midterm or assignment with “New grade”, with its subject and its weight.","Deja la nota vacía si aún no la tienes: contará como pendiente.":"Leave the grade empty if you don't have it yet: it will count as pending.","Con los porcentajes puestos, Digesto calcula cuánto llevas y qué media necesitas en lo que queda para llegar a tu objetivo.":"With the weights in, Digesto works out how much you have and the average you need in what's left to reach your target.","Cambia el objetivo de cada asignatura: aprobar con un 5 o aspirar a más.":"Change each subject's target: pass with a 5 or aim higher.","Es un cálculo orientativo. Si tu asignatura exige una nota mínima en el examen final, tenlo en cuenta.":"It's a guide. If your subject requires a minimum mark in the final exam, bear it in mind.",
"Tu semana y tus fechas importantes.":"Your week and your important dates.","«Añadir al horario» es para lo que se repite cada semana: clases, trabajo y deporte. Se apunta una sola vez.":"“Add to timetable” is for what repeats every week: classes, work and sport. You add it once.","«Nueva fecha» es para exámenes, entregas y eventos. Tú eliges desde cuándo te avisa.":"“New date” is for exams, deadlines and events. You choose how early it warns you.","Asigna cada examen a su asignatura: así Hoy te calcula el plan.":"Assign each exam to its subject: that way Today works out your plan.","En una entrega, pulsa «Entregado» cuando la termines.":"For a deadline, tap “Submitted” when you're done.","Con borde, lo que tiene fecha. Sin borde, tu horario fijo. Toca cualquiera para cambiarlo.":"With a border: dated items. Without: your weekly timetable. Tap any to change it.",

"En el ordenador, Ctrl + K o la tecla / abren el buscador.":"On a computer, Ctrl + K or the / key opens search.","En el repaso de fichas, la tecla 1 es «No la sabía» y la 2 es «La sabía».":"In flashcard review, key 1 is “Didn't know it” and 2 is “Knew it”.","En los apuntes, Ctrl + B pone negrita y Ctrl + I, cursiva.":"In notes, Ctrl + B makes bold and Ctrl + I italic.","La balanza de arriba lleva siempre a Hoy.":"The scales icon at the top always takes you to Today.","El botón «?» de arriba abre la ayuda de la pantalla en la que estás.":"The “?” button at the top opens the help for the screen you're on.","Lo que creas desde la página de una asignatura ya sale con esa asignatura puesta.":"Anything you create from a subject's page already has that subject set.","En el teléfono, las tarjetas de aviso de Hoy se pasan de lado con el dedo.":"On a phone, Today's warning cards swipe sideways.","Si una fecha coincide con un hito, verás «Tal día como hoy» en la portada.":"If a date matches a milestone, you'll see “On this day” on the front page.","En el ordenador, el menú se abre con las tres rayas y se cierra solo al elegir.":"On a computer, the menu opens with the three lines and closes itself when you choose.","El botón Atrás del teléfono o del navegador vuelve a la sección anterior.":"The phone's or browser's Back button returns to the previous section.","Al editar un tema puedes subirlo o bajarlo en la lista para dejarlo en el orden del programa.":"When editing a topic you can move it up or down to match the syllabus order.",
"¿Dónde se guardan mis datos?":"Where is my data stored?","En tu cuenta. Los ves en cualquier dispositivo al entrar con tu correo y tu contraseña.":"In your account. You see it on any device when you sign in with your email and password.","Cifrados, solo en este navegador. No pasan solos a otro dispositivo y se pierden si borras los datos de navegación. En iPhone, el navegador puede borrarlos si pasas varios días sin entrar, así que haz copias.":"Encrypted, only in this browser. It doesn't move to another device on its own and is lost if you clear your browsing data. On iPhone the browser may delete it if you don't visit for several days, so make backups.","He olvidado mi contraseña":"I forgot my password","En la pantalla de acceso, pulsa «He olvidado mi contraseña» y te llegará un enlace al correo para elegir otra. Si el correo no llega, avisa a quien te dio acceso a Digesto.":"On the sign-in screen, tap “I forgot my password” and you'll get an email link to choose another. If the email doesn't arrive, tell whoever gave you access to Digesto.","No se puede recuperar: sin ella el cuaderno no se descifra. Puedes borrarlo y crear otro, y recuperar tus datos si guardaste un archivo de copia.":"It can't be recovered: without it the notebook can't be decrypted. You can delete it and create another, and restore your data if you saved a backup file.",
"¿Cómo lo uso en el móvil?":"How do I use it on my phone?","Abre la misma dirección en el navegador del teléfono y entra con tu cuenta. Desde el menú del navegador puedes añadirla a la pantalla de inicio.":"Open the same address in your phone's browser and sign in with your account. From the browser menu you can add it to your home screen.","Descarga una copia en Ajustes, pásala al teléfono y recupérala allí. Cada dispositivo tiene su propio cuaderno.":"Download a backup in Settings, move it to your phone and restore it there. Each device has its own notebook.","¿Cómo hago una copia de seguridad?":"How do I make a backup?","En Ajustes, «Descargar archivo». Guárdala en un sitio privado, porque la copia no va cifrada. Para recuperarla, usa «Recuperar copia» en el mismo sitio.":"In Settings, “Download file”. Keep it somewhere private, because the backup isn't encrypted. To restore it, use “Restore backup” in the same place.","He borrado algo sin querer":"I deleted something by mistake","Si tienes una copia reciente, recupérala en Ajustes: sustituye todo por lo que había en la copia. Sin copia no se puede recuperar.":"If you have a recent backup, restore it in Settings: it replaces everything with what was in the backup. Without a backup it can't be recovered.","El temporizador no suena":"The timer doesn't sound","Con la pantalla bloqueada el teléfono pausa la web, y el aviso sonará al volver a abrirla. Comprueba también que no esté en silencio.":"With the screen locked the phone pauses the site, and the sound will play when you open it again. Also check it isn't on silent.","¿Me avisa con la web cerrada?":"Does it notify me when the site is closed?","No. Los avisos de la campana y las tarjetas aparecen al abrir Digesto.":"No. The bell and card notifications appear when you open Digesto.","La sesión se ha cerrado sola":"My session closed by itself","Pasa tras 20 minutos sin uso. Tus datos no se pierden: vuelve a entrar.":"It happens after 20 minutes without use. Your data isn't lost: just sign in again.","Pasa tras 20 minutos sin uso si no marcaste «Mantener la sesión abierta». En iPhone, además, el navegador puede cerrarla tras varios días sin entrar. Tus datos no se pierden: vuelve a entrar.":"It happens after 20 minutes without use if you didn't tick “Keep me signed in”. On iPhone the browser may also close it after several days away. Your data isn't lost: just sign in again.","¿Puedo fiarme de los hitos y los festivos?":"Can I trust the milestones and holidays?","Son material de apoyo. Las fechas y citas de los hitos conviene contrastarlas con tu manual, y los festivos con el calendario oficial de cada año.":"They're support material. Check the milestones' dates and quotes against your textbook, and the holidays against each year's official calendar.","¿Qué es «Ver un ejemplo»?":"What is “See an example”?","Enseña Digesto lleno con datos de muestra. Nada de lo que hagas ahí se guarda, y al salir vuelves a tu cuaderno tal como estaba.":"It shows Digesto filled with sample data. Nothing you do there is saved, and when you leave you're back to your notebook as it was.",
"Recordar fija más que releer":"Recalling sticks better than rereading","Intentar responder de memoria es lo que consolida lo aprendido. Por eso las fichas te hacen contestar antes de mirar.":"Trying to answer from memory is what consolidates learning. That's why flashcards make you answer before looking.","Repasar espaciado":"Spaced review","Es mejor ver algo cinco veces en un mes que cinco veces en una tarde. Digesto separa cada repaso un poco más que el anterior.":"It's better to see something five times in a month than five times in an afternoon. Digesto spaces each review a little more than the last.","Repartir el temario":"Spread the syllabus","Divide lo que queda entre los días que faltan. El «Plan hasta el examen» hace esa cuenta por ti y te dice el ritmo.":"Divide what's left by the days remaining. “Plan until the exam” does that sum for you and tells you the pace.","Sesiones cortas con descanso":"Short sessions with breaks","Veinticinco minutos de atención de verdad rinden más que dos horas a medias. Usa el temporizador y respeta el descanso.":"Twenty-five minutes of real focus beat two half-hearted hours. Use the timer and take the break.","Apuntes con tus palabras":"Notes in your own words","Copiar no es estudiar. Resume cada tema con tu propia estructura; las plantillas te dan el esqueleto.":"Copying isn't studying. Summarise each topic in your own structure; templates give you the skeleton.","Constancia antes que intensidad":"Consistency over intensity","Un poco cada día gana a un atracón la víspera. La racha está para que no rompas la cadena.":"A little every day beats cramming the night before. The streak is there so you don't break the chain.",

function paceTxt(rem,days){
 if(rem===0)return "Temario dominado. Usa los días que quedan para repasar con fichas.";
 const temas=rem===1?"1 tema":rem+" temas";
 if(days<=0)return `Es hoy y quedan ${temas} sin dominar. Repasa solo lo esencial.`;
 if(rem<=days){const n=Math.floor(days/rem);return `Quedan ${temas}. `+(n===1?"Con uno al día llegas.":`Con uno cada ${n} días llegas con margen.`)}

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1,12)}

const NOTE_TAGS={P:1,BR:1,H2:1,H3:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,PRE:1,B:1,STRONG:1,I:1,EM:1,U:1,MARK:1};
/* Solo se conservan las etiquetas de formato de la lista; el resto se queda en texto */
function sanitizeNote(html){const tp=document.createElement("template");tp.innerHTML=String(html||"");
 const walk=n=>{[...n.childNodes].forEach(c=>{
  if(c.nodeType===3)return;
  if(c.nodeType!==1||/^(script|style|iframe|object|embed|svg|math|link|meta|template|noscript|img|video|audio|form|input|button|textarea|select)$/i.test(c.tagName)){c.remove();return}
  walk(c);const tag=c.tagName;
  if(tag==="DIV"){const np=document.createElement("p");np.append(...c.childNodes);c.replaceWith(np);return}
  if(!NOTE_TAGS[tag]){c.replaceWith(...c.childNodes);return}
  const keep=tag==="UL"&&c.classList.contains("chk")?"chk":tag==="LI"&&c.classList.contains("done")?"done":"";
  [...c.attributes].forEach(a=>c.removeAttribute(a.name));if(keep)c.className=keep})};
 walk(tp.content);return tp.innerHTML}
function noteText(h){const d=document.createElement("div");d.innerHTML=String(h||"").replace(/<\/(p|h2|h3|li|blockquote|pre)>|<br>/g,"$& ");return d.textContent.replace(/\s+/g," ").trim()}

function edCmd(cmd){const ed=$("#ed");if(!ed)return;
 const sel=getSelection();ed.focus();if(edRange&&!(sel.rangeCount&&ed.contains(sel.anchorNode))){sel.removeAllRanges();sel.addRange(edRange)}
 const blockOf=()=>{let n=getSelection().anchorNode;while(n&&n!==ed&&n.parentNode!==ed)n=n.parentNode;return n&&n!==ed&&n.nodeType===1?n:null};
 const X=(c,v)=>document.execCommand(c,false,v);
 if(cmd==="ficha")return makeCard();

 if(cmd==="b")X("bold");else if(cmd==="i")X("italic");
 else if(cmd==="ul")X("insertUnorderedList");else if(cmd==="ol")X("insertOrderedList");
 else if(cmd==="chk"){const list=()=>{const a=getSelection().anchorNode,l=a&&(a.nodeType===1?a:a.parentElement).closest("ul,ol");return l&&ed.contains(l)?l:null};
  let l=list();if(!l||l.tagName!=="UL"){X("insertUnorderedList");l=list()}if(l&&l.tagName==="UL")l.classList.toggle("chk")}
 else if(cmd==="mark"){const a=sel.anchorNode,m=a&&(a.nodeType===1?a:a.parentElement).closest("mark");
  if(m&&ed.contains(m))m.replaceWith(...m.childNodes);
  else{const txt=sel.toString();if(!txt.trim())return toast("Selecciona primero el texto que quieres resaltar.");if(/\n/.test(txt))return toast("Resalta el texto de un solo párrafo cada vez.");X("insertHTML","<mark>"+esc(txt)+"</mark>")}}
 else{const b=blockOf();X("formatBlock","<"+(b&&b.tagName.toLowerCase()===cmd?"p":cmd)+">")}
 fixLists(ed);noteChanged()}
/* El navegador a veces mete la lista dentro de un párrafo; se saca fuera para que el texto quede limpio */
function fixLists(root){root.querySelectorAll("p>ul,p>ol").forEach(l=>{const par=l.parentNode;if(par.childNodes.length===1)par.replaceWith(l);else par.after(l)});
 /* Y el texto que queda suelto, sin párrafo, se envuelve en uno */
 let run=[];const wrap=()=>{if(!run.length)return;const np=document.createElement("p");run[0].before(np);run.forEach(n=>np.append(n));run=[]};
 [...root.childNodes].forEach(n=>{
  if(n.nodeType===1&&/^(P|DIV|H2|H3|UL|OL|BLOCKQUOTE|PRE)$/.test(n.tagName))wrap();
  else if(n.nodeName==="BR"){if(run.length){wrap();n.remove()}else{const np=document.createElement("p");n.before(np);np.append(n)}}
  else if(n.nodeType===3&&!n.textContent.trim()&&!run.length)n.remove();
  else run.push(n)});
 wrap()}
