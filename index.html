<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex,nofollow">
<title>Cuaderno de Derecho y RRII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral de secciones (barra inferior en móvil) + área de trabajo; "Hoy" abre con el siguiente paso, la máxima del día y el plan hasta el examen */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d9dfe6;
  --ink:#16202c; --muted:#5d6b7a; --accent:#1f4e79; --accent-soft:#e1eaf3;
  --seal:#8a2b3a; --gold:#a57a1c;
  --ok:#2f7a4f; --warn:#b46a10; --crit:#b3312f;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --gold:#d8b25a; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --surface-2:#1c2733; --line:#2a3644;
  --ink:#e6ebf0; --muted:#94a3b3; --accent:#7fb0de; --accent-soft:#1d3247;
  --seal:#d98292; --gold:#d8b25a; --ok:#6cc292; --warn:#e3a453; --crit:#ec7b78; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;-webkit-tap-highlight-color:transparent}
button,summary,a,select,label{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--f-display);font-size:22px;line-height:1.15;padding-inline:8px}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.count.due{color:var(--seal);font-weight:600}
.mini{all:unset;cursor:pointer;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);text-align:center}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
main{padding-block:32px 64px;padding-inline:40px;min-width:0;max-width:1100px;width:100%}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn.good{background:var(--ok)}
.iconbtn{all:unset;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:13px;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.grid2>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{font-size:13px;color:var(--muted)}
/* Acceso: pantalla de usuario y contraseña */
.gate{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-inline:16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.gate-card h1{font-size:28px}
.gate-card p{margin:0}
.gate-card .seal{width:48px;height:48px;font-size:22px}
.gerr{color:var(--crit);font-size:14px;font-weight:500;min-height:1.5em}
.gate-card details{font-size:14px;color:var(--muted)}
.gate-card details p{margin:8px 0 12px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12px;text-decoration:underline}
/* Bienvenida y avisos */
.welcome{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:24px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.welcome p{margin:0;max-width:62ch}
.welcome .addline{max-width:520px;flex-wrap:wrap}
.notice{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;color:var(--muted);font-size:14px}
/* Máxima */
.maxim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:20px}
.seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-style:italic}
.maxim q{font-family:var(--f-display);font-style:italic;font-size:26px;line-height:1.2;quotes:none;display:block}
.maxim p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
button.stat{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
button.stat.hot{border-color:var(--seal)} button.stat.hot b{color:var(--seal)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
/* Plan hasta el examen */
.plan{padding:12px 0;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}
.plan-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.plan-h .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.plan p{margin:8px 0 0;font-size:14px}
/* Listas */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:13px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row .acts{display:flex;gap:2px}
.group{margin-top:16px}
.group:first-of-type{margin-top:4px}
.date{width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.date b{display:block;font-family:var(--f-display);font-size:20px;line-height:1}
.date small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.examen{color:var(--crit)} .pill.entrega{color:var(--warn)} .pill.clase{color:var(--accent)} .pill.conferencia{color:var(--gold)} .pill.otro{color:var(--muted)} .pill.trabajo{color:var(--seal)} .pill.deporte{color:var(--ok)}
.examen{--tc:var(--crit)} .entrega{--tc:var(--warn)} .clase{--tc:var(--accent)} .conferencia{--tc:var(--gold)} .trabajo{--tc:var(--seal)} .deporte{--tc:var(--ok)} .otro{--tc:var(--muted)}
.soon{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.soon.hot{color:var(--crit)}
/* Campana de avisos */
.app{position:relative}
.bell{all:unset;cursor:pointer;position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);z-index:6}
.bell:hover{border-color:var(--accent);color:var(--accent)}
.bell.ring svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(14deg)}82%{transform:rotate(-12deg)}88%{transform:rotate(8deg)}94%{transform:rotate(-4deg)}}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:var(--surface);font-size:11px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.notif{position:absolute;top:72px;right:24px;width:min(360px,calc(100% - 32px));max-height:min(70vh,520px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:7;box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
.nrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.nrow:hover strong{color:var(--accent)}
.nrow.new strong::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-left:8px;vertical-align:middle}
@media (min-width:561px){.head{padding-right:56px}}
/* Avisos de lo que se acerca: tarjetas con volumen, inclinadas en 3D */
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:28px;perspective:900px}
.acard{all:unset;cursor:pointer;box-sizing:border-box;position:relative;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:20px;border-radius:16px;min-width:0;
  background:linear-gradient(150deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  transform-style:preserve-3d;transform:rotateX(var(--rx,7deg)) rotateY(var(--ry,-9deg));transition:transform .2s ease;
  box-shadow:0 22px 30px -20px rgba(0,0,0,.45)}
.acard::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent-soft);border:1px solid var(--line);transform:translateZ(-18px) translate(8px,10px);z-index:-1}
.acard.warm{border-color:var(--warn)} .acard.hot{border-color:var(--crit)}
.acard.warm::before{background:var(--warn);opacity:.35} .acard.hot::before{background:var(--crit);opacity:.4}
.acard .num{transform:translateZ(42px);width:76px;height:76px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent);color:var(--surface);box-shadow:0 12px 18px -10px rgba(0,0,0,.5)}
.acard.warm .num{background:var(--warn)} .acard.hot .num{background:var(--crit)}
.acard .num b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.acard .num b.w{font-size:17px}
.acard .num small{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.acard .txt{transform:translateZ(20px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;overflow-wrap:anywhere}
.acard .txt strong{font-family:var(--f-display);font-size:19px;line-height:1.2;font-weight:600}
.acard .tip{font-size:13px}
.acard:active{transform:rotateX(0) rotateY(0)}
/* Semana: horario fijo y eventos con fecha, día a día */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.wd{display:flex;flex-direction:column;gap:6px;min-width:0}
.wd-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wd-h b{font-family:var(--f-display);font-size:16px;letter-spacing:0;color:var(--ink)}
.wd.hoy .wd-h{color:var(--accent);border-color:var(--accent)} .wd.hoy .wd-h b{color:var(--accent)}
.wd-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;font-size:12px;line-height:1.3;padding:6px 8px;border-radius:6px;background:var(--surface-2);border:1px solid transparent;overflow-wrap:anywhere}
.slot:hover{border-color:var(--tc)}
.slot .st{display:block;font-family:var(--f-mono);font-size:10px;color:var(--tc)}
.slot.ev{background:transparent;border-color:var(--tc);font-weight:600}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.days{border:0;padding:0;margin:0;display:flex;gap:6px;flex-wrap:wrap}
.days legend{font-size:13px;font-weight:500;color:var(--muted);padding:0;margin-bottom:4px}
.days label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-transform:capitalize;color:var(--ink)}
/* Temas */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.subj-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.area{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.area.Derecho{color:var(--seal)} .area.RRII{color:var(--accent)}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.status{all:unset;cursor:pointer;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);margin-top:4px;flex:none;position:relative}
button.status::after{content:"";position:absolute;inset:-13px}
.status.curso{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.status.dominado{border-color:var(--ok);background:var(--ok)}
.topic .n{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .status{margin:0;cursor:default}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0}
.subj-foot{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
/* Enlaces y fichas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:auto;max-width:100%}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.link a{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.link a:hover{text-decoration:underline}
.link .dom{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.link .note{font-size:14px;border-left:2px solid var(--gold);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.link .q{font-weight:600;overflow-wrap:anywhere}
.link .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
details.panel{margin-bottom:16px;padding:14px 20px}
details summary{cursor:pointer;font-weight:600}
.src{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.src:first-of-type{margin-top:12px}
.src a{color:var(--accent);font-weight:600;text-decoration:none}
.duebox{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.duebox b{font-family:var(--f-display);font-size:24px;font-weight:600}
/* Repaso de fichas */
.review{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;min-height:240px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.card .cq{font-family:var(--f-display);font-size:26px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.card .ca{border-top:1px solid var(--line);padding-top:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.review .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review .ctrl .btn{flex:1;max-width:220px}
.btn.miss{background:transparent;color:var(--crit);border:1px solid var(--crit)}
/* Formularios */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form>*{min-width:0}
.form .full{grid-column:1/-1}
input[type=date],input[type=time]{min-height:38px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=checkbox]{flex:none;width:18px;height:18px;padding:0}
.form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow-y:auto}
dialog::backdrop{background:rgba(10,15,20,.45)}
dialog h2{margin-bottom:16px}
/* Temporizador */
.pomo{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.pomo .time{font-family:var(--f-mono);font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pomo .modes,.pomo .ctrl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{all:unset;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
/* Semana: una barra por día, a escala del objetivo diario */
.week{display:flex;gap:6px;margin-top:12px;align-items:flex-end}
.week>div{flex:1;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:10px;color:var(--muted)}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"#";
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
function upcoming(){const t=today();return S.events.filter(e=>e.date>=t&&!e.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function dueCards(){const t=today();return S.cards.filter(c=>c.due<=t)}
function counts(){$("#c-temas").textContent=S.subjects.reduce((a,s)=>a+s.topics.length,0);$("#c-enlaces").textContent=S.links.length;$("#c-eventos").textContent=upcoming().length;
 const d=dueCards().length,c=$("#c-fichas");c.textContent=d||S.cards.length;c.classList.toggle("due",d>0);c.title=d?d+" para repasar hoy":"";updateBell()}
function daysTo(d){return Math.round((Date.parse(d)-Date.parse(today()))/864e5)}
function soonTxt(n){return n===0?"hoy":n===1?"mañana":"en "+n+" días"}
function fmtMin(m){return m<60?m+" min":Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":"")}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function dateBox(d){const x=new Date(d+"T12:00");return `<div class="date"><b>${x.getDate()}</b><small>${MES[x.getMonth()]}</small></div>`}
function subjOptions(sel,first="Sin asignatura"){return `<option value="">${first}</option>`+S.subjects.map(s=>`<option ${s.name===sel?"selected":""}>${esc(s.name)}</option>`).join("")}
function eventRow(e,edit){const n=daysTo(e.date),past=n<0||e.done;
 return `<div class="row ${e.done?"done":""}">${dateBox(e.date)}<div style="min-width:0"><div class="t">${esc(e.title)}</div><div class="s">${esc([e.time,e.subject,e.note].filter(Boolean).join(" · "))}</div></div>
 <div class="side"><span class="pill ${e.type}">${TYPES[e.type]}</span><span class="soon ${!past&&n<=3&&e.type!=="clase"?"hot":""}">${e.done?"hecho":n>=0?soonTxt(n):"pasado"}</span>
 ${edit?`<div class="acts">${e.type==="entrega"&&!e.done?`<button class="iconbtn" data-done="${e.id}">Entregado</button>`:""}<button class="iconbtn" data-ede="${e.id}">Editar</button></div>`:""}</div></div>`}

/* ---------- ESTUDIO: racha, minutos y ritmo hasta el examen ---------- */
function streak(){let n=0,d=new Date();if(!S.studyDays.includes(iso(d)))d.setDate(d.getDate()-1);while(S.studyDays.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function markStudied(){const t=today();if(S.studyDays.includes(t))return;S.studyDays.push(t);save();const n=streak();
 toast({3:"Tres días seguidos. Así empieza un hábito.",7:"Una semana entera estudiando. Enhorabuena.",14:"Dos semanas seguidas. Ya es parte de tu rutina.",30:"Treinta días seguidos. Esto ya es disciplina de jurista.",50:"Cincuenta días seguidos. Extraordinario.",100:"Cien días seguidos. Extraordinario."}[n]||"Hoy ya cuenta. Llevas "+n+(n===1?" día.":" días seguidos."))}
function paceTxt(rem,days){
 if(rem===0)return "Temario dominado. Usa los días que quedan para repasar con fichas.";
 const temas=rem===1?"1 tema":rem+" temas";
 if(days<=0)return `Es hoy y quedan ${temas} sin dominar. Repasa solo lo esencial.`;
 if(rem<=days){const n=Math.floor(days/rem);return `Quedan ${temas}. `+(n===1?"Con uno al día llegas.":`Con uno cada ${n} días llegas con margen.`)}
 return `Quedan ${temas}. Necesitas ${Math.ceil(rem/days)} al día: empieza hoy por el más corto.`}

/* ---------- DÍA A DÍA: horario fijo de la semana, hueco para estudiar y avisos ---------- */
const toM=t=>{const[a,b]=t.split(":");return a*60+ +b}, fmtT=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
function weekDays(off){const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7+off*7);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
function dayItems(date){const k=iso(date),g=date.getDay();
 return [...S.routine.filter(r=>r.days.includes(g)).map(r=>({t:r.start,end:r.end,title:r.title,type:r.type,note:r.note,rid:r.id})),
  ...S.events.filter(e=>e.date===k).map(e=>({t:e.time,end:"",title:e.title,type:e.type,note:e.note,eid:e.id,done:e.done}))].sort((a,b)=>(a.t||"99").localeCompare(b.t||"99"))}
/* El hueco libre más largo de hoy entre las 8:00 y las 22:00, contando desde ahora */
function studyGap(){const now=new Date(),end=22*60;let cur=Math.ceil(Math.max(now.getHours()*60+now.getMinutes(),8*60)/5)*5,best=null;
 const bl=dayItems(now).filter(i=>i.t).map(i=>[toM(i.t),i.end?toM(i.end):toM(i.t)+60]).sort((a,b)=>a[0]-b[0]);
 for(const[a,b] of [...bl,[end,end]]){if(a-cur>=30&&(!best||a-cur>best[1]-best[0]))best=[cur,a];cur=Math.max(cur,b)}
 return best}
function dayPanel(){const it=dayItems(new Date()),g=studyGap(),late=new Date().getHours()>=22;
 const hint=late?"El día ya está hecho. Descansa, mañana más.":g?`Tu mejor hueco para estudiar hoy: de ${fmtT(g[0])} a ${fmtT(g[1])}.`:"Hoy vas justa de tiempo. Diez minutos de fichas también cuentan.";
 return `<div class="panel"><div class="phead"><h2>Tu día</h2><button class="btn ghost small" data-go="eventos">Ver semana</button></div>
 <div class="list">${it.map(i=>`<div class="row" style="grid-template-columns:48px 1fr auto"><span class="soon" style="text-align:left">${esc(i.t||"")}</span><div class="t">${esc(i.title)}${i.end||i.note?`<div class="s">${esc([i.end&&"hasta las "+i.end,i.note].filter(Boolean).join(" · "))}</div>`:""}</div><span class="pill ${i.type}">${TYPES[i.type]}</span></div>`).join("")||`<div class="empty">Sin clases ni compromisos hoy. Apunta tu horario en Agenda y lo verás aquí cada día.</div>`}</div>
 <p class="sub" style="margin:10px 0 0">${hint}</p></div>`}
function avisos(){
 const out=upcoming().map(e=>({e,n:daysTo(e.date)})).filter(x=>x.n<=x.e.warn).map(x=>({...x,id:"e:"+x.e.id+":"+(x.n<=1?"ya":"pronto")}));
 const d=dueCards().length;if(d)out.push({id:"f:"+today(),n:0,fichas:d});
 return out}
function whenTxt(e){return new Date(e.date+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})+(e.time?" · "+e.time:"")}
function alertCards(){
 const imp=x=>x.e.type==="examen"||x.e.type==="entrega"?1:0, a=avisos().filter(x=>x.e).sort((x,y)=>imp(y)-imp(x)||x.n-y.n).slice(0,3);
 if(!a.length)return "";
 return `<div class="alerts">${a.map(({e,n})=>{const sj=e.type==="examen"&&S.subjects.find(x=>x.name===e.subject), tip=sj&&sj.topics.length?paceTxt(sj.topics.filter(t=>t.s!=="dominado").length,n):e.note;
  return `<button class="acard ${n<=1?"hot":n<=3?"warm":""}" data-go="eventos"><span class="num">${n>1?`<b>${n}</b><small>días</small>`:`<b class="w">${n?"Mañana":"Hoy"}</b>`}</span><span class="txt"><span class="pill ${e.type}">${TYPES[e.type]}</span><strong>${esc(e.title)}</strong><span class="sub">${esc(whenTxt(e))}</span>${tip?`<span class="tip">${esc(tip)}</span>`:""}</span></button>`}).join("")}</div>`}
/* La tarjeta sigue al puntero; en pantallas táctiles se queda con su inclinación fija */
function tilt(c){if(matchMedia("(prefers-reduced-motion: reduce)").matches||!matchMedia("(hover: hover)").matches)return;
 c.onpointermove=ev=>{const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;c.style.setProperty("--ry",(x*20).toFixed(1)+"deg");c.style.setProperty("--rx",(-y*16).toFixed(1)+"deg")};
 c.onpointerleave=()=>{c.style.removeProperty("--rx");c.style.removeProperty("--ry")}}
function updateBell(){const un=avisos().filter(x=>!S.seen.includes(x.id)).length,b=$("#bellN"),bell=$("#bell");b.hidden=!un;b.textContent=un;bell.classList.toggle("ring",un>0);bell.setAttribute("aria-label",un?`Avisos: ${un} sin ver`:"Avisos")}
function openNotif(){const a=avisos(),box=$("#notif");
 box.innerHTML=`<div class="phead"><h2>Avisos</h2><button class="iconbtn" id="notifX">Cerrar</button></div>`+
  (a.map(x=>{const nw=S.seen.includes(x.id)?"":"new";return x.e
   ?`<button class="nrow ${nw}" data-ngo="eventos"><span class="pill ${x.e.type}">${TYPES[x.e.type]}</span><strong>${esc(x.e.title)}</strong><span class="sub">${x.n===0?"Es hoy":x.n===1?"Es mañana":"Faltan "+x.n+" días"} · ${esc(whenTxt(x.e))}</span></button>`
   :`<button class="nrow ${nw}" data-ngo="fichas"><strong>${x.fichas} ${x.fichas===1?"ficha":"fichas"} para repasar hoy</strong><span class="sub">Unos ${Math.max(1,Math.round(x.fichas/2))} minutos.</span></button>`}).join("")
   ||`<p class="empty">No tienes avisos. Cuando se acerque un examen, una entrega o cualquier fecha que apuntes, aparecerá aquí.</p>`)+
  `<p class="sub" style="margin:10px 0 0;border-top:1px solid var(--line);padding-top:10px">Los avisos aparecen al abrir el cuaderno. Tú eliges con cuánta antelación al apuntar cada fecha.</p>`;
 box.hidden=false;$("#bell").setAttribute("aria-expanded","true");
 $("#notifX").onclick=closeNotif;
 box.querySelectorAll("[data-ngo]").forEach(b=>b.onclick=()=>{closeNotif();go(b.dataset.ngo)});
 S.seen=a.map(x=>x.id);save()}
function closeNotif(){$("#notif").hidden=true;$("#bell").setAttribute("aria-expanded","false")}
$("#bell").onclick=()=>$("#notif").hidden?openNotif():closeNotif();
document.addEventListener("pointerdown",e=>{if(!$("#notif").hidden&&!e.target.closest("#notif,#bell"))closeNotif()});

 const plan=exams.map(e=>{const s=S.subjects.find(x=>x.name===e.subject),d=s.topics.filter(x=>x.s==="dominado").length,n=daysTo(e.date),p=s.topics.length?Math.round(d/s.topics.length*100):0;

 const nextTxt=next?`${next.title.toLowerCase().startsWith(next.type)?"":TYPES[next.type]+": "}${next.title}, ${soonTxt(daysTo(next.date))}.`:"No tienes exámenes ni entregas a la vista.";
 const paso=due?`Tienes ${due} ${due===1?"ficha":"fichas"} para repasar hoy.`:!studied?"Una sesión de 25 minutos y el día ya cuenta.":"Hoy ya has estudiado. Lo demás es ventaja.";
 const bkOld=!S.ejemplo&&(S.subjects.length||S.cards.length)&&(!S.lastBackup||daysTo(S.lastBackup)<-14);

 ${due?`<button class="btn" id="goRev">Repasar ${due} ${due===1?"ficha":"fichas"}</button>`:""}</div>
 ${!S.onboarded?`<div class="welcome"><h2>Este es tu cuaderno de la carrera</h2>

 :S.ejemplo?`<div class="notice"><span>Estás viendo datos de ejemplo.</span><button class="btn ghost small" id="clearSample">Borrarlos y empezar con los míos</button></div>`:""}
 ${alertCards()}
 <div class="maxim"><div class="seal">§</div><div><div class="eyebrow">Máxima del día</div><q lang="la">${m[0]}</q><p>${m[1]}</p></div></div>
 <div class="stats">
  <div class="stat"><b>${pct}%</b><span>temario dominado</span><div class="bar"><i style="width:${pct}%"></i></div></div>

  <div class="stat"><b>${minHoy}</b><span>min hoy, de ${S.goal} de objetivo</span><div class="bar"><i style="width:${Math.min(100,Math.round(minHoy/S.goal*100))}%"></i></div></div>

}

function vEnlaces(){
 const term=q.toLowerCase();

function answer(known){
 const c=S.cards.find(x=>x.id===R.queue[R.i]), first=!R.again.has(c.id);
 if(first&&known)R.ok++;
 if(!R.free){if(!known)c.box=0;else if(first)c.box=Math.min(4,c.box+1);c.due=addDays(known?INTERVALS[c.box]:1)}

 R.i++;R.shown=false;
 if(R.i>=R.queue.length){R.done=true;save();markStudied()}else save();
 render();
}

  <label class="full" for="f-rty">Tipo<select id="f-rty" name="type">${["clase","trabajo","deporte","otro"].map(k=>`<option value="${k}" ${r?.type===k?"selected":""}>${TYPES[k]}</option>`).join("")}</select></label>
  <fieldset class="full days"><legend>Días de la semana</legend>${ORDEN.map(n=>`<label for="f-d${n}"><input id="f-d${n}" type="checkbox" name="day" value="${n}" ${r?.days.includes(n)?"checked":""}>${DIAS[n].slice(0,3)}</label>`).join("")}</fieldset>
  <label for="f-rs">Empieza<input id="f-rs" name="start" type="time" required value="${esc(r?.start)}"></label>
  <label for="f-re">Termina<input id="f-re" name="end" type="time" value="${esc(r?.end)}"></label>
  <label class="full" for="f-rn">Notas<input id="f-rn" name="note" value="${esc(r?.note)}" placeholder="Aula, lugar…"></label>`,
 d=>{const days=[...F.querySelectorAll("[name=day]:checked")].map(x=>+x.value);
  if(!days.length){toast("Elige al menos un día.");return false}
  if(d.end&&d.end<=d.start){toast("La hora de fin debe ser posterior a la de inicio.");return false}
  delete d.day;const v={...d,days};if(r)Object.assign(r,v);else S.routine.push({id:uid(),...v})},
 r&&(()=>{S.routine=S.routine.filter(x=>x!==r)}))}
function eventForm(e){openForm(e?"Editar fecha":"Nueva fecha",
 `<label class="full" for="f-et">Qué es<input id="f-et" name="title" required value="${esc(e?.title)}" placeholder="Examen final de Derecho Penal"></label>
  <label for="f-ed">Fecha<input id="f-ed" name="date" type="date" required value="${esc(e?.date||today())}"></label>
  <label for="f-eh">Hora<input id="f-eh" name="time" type="time" value="${esc(e?.time)}"></label>
  <label for="f-ety">Tipo<select id="f-ety" name="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${e?.type===k?"selected":""}>${v}</option>`).join("")}</select></label>
  <label for="f-es">Asignatura<select id="f-es" name="subject">${subjOptions(e?.subject)}</select></label>
  <label class="full" for="f-en">Notas<input id="f-en" name="note" value="${esc(e?.note)}" placeholder="Aula, temas que entran…"></label>
  <label class="full" for="f-ew">Avísame<select id="f-ew" name="warn">${[[0,"El mismo día"],[1,"Desde el día antes"],[3,"Desde 3 días antes"],[7,"Desde una semana antes"],[14,"Desde dos semanas antes"]].map(([k,v])=>`<option value="${k}" ${(e?e.warn:7)===k?"selected":""}>${v}</option>`).join("")}</select></label>`,
 d=>{d.warn=+d.warn;if(e)Object.assign(e,d);else S.events.push({id:uid(),done:false,...d})},e&&(()=>{S.events=S.events.filter(x=>x!==e)}))}

/* ---------- TEMPORIZADOR: cuenta contra la hora de fin, así no se atrasa con la pestaña en segundo plano ---------- */
const P={len:25,left:25*60,run:false,end:0,tm:null,ac:null};
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function paintP(){const el=$("#ptime");if(el)el.textContent=fmt(P.left);const b=$("#pgo");if(b)b.textContent=P.run?"Pausar":P.left<P.len*60?"Seguir":"Empezar";
 const mini=$("#mini"),on=P.run||P.left<P.len*60;mini.hidden=!on;mini.textContent=(P.len===5?"Descanso ":"Estudio ")+fmt(P.left)+(P.run?"":" (pausa)");
 document.title=P.run?fmt(P.left)+" · Cuaderno":TITLE}
function startP(){try{P.ac=P.ac||new (window.AudioContext||window.webkitAudioContext)();P.ac.resume()}catch(e){}
 P.run=true;P.end=Date.now()+P.left*1000;clearInterval(P.tm);P.tm=setInterval(tickP,500);paintP()}
function tickP(){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));paintP();if(P.left<=0)finishP()}
function pauseP(){clearInterval(P.tm);P.run=false;paintP()}
function resetP(){clearInterval(P.tm);P.run=false;P.left=P.len*60;paintP()}
function beep(){try{const ac=P.ac;if(!ac)return;[0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,ac.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.28);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.3)})}catch(e){}}
function finishP(){const len=P.len;beep();
 if(len!==5){const t=today();S.minutes[t]=(S.minutes[t]||0)+len;save();markStudied();P.back=len;P.len=5;toast(`Sesión de ${len} minutos terminada. Ahora, 5 de descanso.`)}
 else{P.len=P.back||25;toast("Descanso terminado. ¿Otra sesión?")}
 resetP();if(view==="hoy")render()}
$("#mini").onclick=()=>{go("hoy");$("#pomo")?.scrollIntoView({block:"center"})};

/* ---------- NAVEGACIÓN ---------- */
const V={hoy:vHoy,temas:vTemas,fichas:vFichas,enlaces:vEnlaces,eventos:vEventos,ajustes:vAjustes};
function render(){if(!V[view])view="hoy";if(fSubj&&!S.subjects.some(s=>s.name===fSubj))fSubj="";document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view));V[view]();$("#bell").hidden=!!R;if(R)closeNotif();main.querySelectorAll(".acard").forEach(tilt);main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));counts()}
function go(v){if(v!=="fichas")R=null;view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{R=null;go(b.dataset.v)});
document.addEventListener("keydown",e=>{if(!OPEN||view!=="fichas"||!R||R.done||dlg.open||!R.shown)return;if(e.key==="1"){e.preventDefault();answer(false)}else if(e.key==="2"){e.preventDefault();answer(true)}});

/* ---------- PANTALLA DE ACCESO ---------- */
const gate=$("#gate"), app=$("#app");
function gateShow(html,onSubmit){
 app.hidden=true;gate.hidden=false;
 gate.innerHTML=`<form class="gate-card" id="gateForm"><div class="seal">§</div><div class="brand" style="padding:0">Cuaderno<small>Derecho · RRII</small></div>${html}</form>`;
 const f=$("#gateForm");
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector("[type=submit]"),txt=b.textContent,err=$("#gerr");if(b.dataset.busy)return;b.dataset.busy=1;b.textContent="Un momento…";err.textContent="";
  let msg="";try{msg=await onSubmit(Object.fromEntries(new FormData(f)))}catch(x){msg="No se pudo completar. Inténtalo de nuevo."}
  if(msg){err.textContent=msg;b.textContent=txt;delete b.dataset.busy}};
 f.querySelector("input")?.focus();
}
function gateSetup(){gateShow(`<h1>Crea tu acceso</h1><p class="sub">Tu cuaderno es privado: se guarda cifrado en este navegador y solo se abre con este usuario y esta contraseña.</p>
 <label for="g-user">Usuario<input id="g-user" name="user" autocomplete="username" required maxlength="40"></label>
 <label for="g-pass">Contraseña (mínimo 8 caracteres)<input id="g-pass" name="pass" type="password" autocomplete="new-password" required minlength="8"></label>
 <label for="g-pass2">Repite la contraseña<input id="g-pass2" name="pass2" type="password" autocomplete="new-password" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Crear mi cuaderno</button>
 <p class="sub">Apúntalos en un lugar seguro. Si los olvidas, nadie puede recuperarlos.</p>`,
 async d=>{if(!d.user.trim())return "Escribe un usuario.";if(d.pass.length<8)return "La contraseña necesita al menos 8 caracteres.";if(d.pass!==d.pass2)return "Las contraseñas no coinciden.";
  SALT=crypto.getRandomValues(new Uint8Array(16));CK=await deriveKey(d.user,d.pass,SALT);if(!S.name)S.name=d.user.trim();
  try{await encState(JSON.stringify(S));localStorage.removeItem(KEY)}catch(e){toast("Este navegador no deja guardar datos. Lo que apuntes se perderá al cerrar.")}
  unlock()})}
function gateLogin(lk){gateShow(`<h1>Entra en tu cuaderno</h1>
 <label for="g-user">Usuario<input id="g-user" name="user" autocomplete="username" required></label>
 <label for="g-pass">Contraseña<input id="g-pass" name="pass" type="password" autocomplete="current-password" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Entrar</button>
 <details><summary>He olvidado mi usuario o mi contraseña</summary><p>No se pueden recuperar: sin ellos el cuaderno no se puede descifrar. Puedes borrarlo de este navegador y crear uno nuevo. Si guardaste un archivo de copia, lo recuperas después en Ajustes.</p><button type="button" class="btn ghost small danger" id="gwipe">Borrar este cuaderno</button></details>`,
 async d=>{const salt=unb64(lk.salt),k=await deriveKey(d.user,d.pass,salt);let st=null;
  try{st=normalize(JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(lk.iv)},k,unb64(lk.data)))))}catch(e){}
  if(!st)return "Usuario o contraseña incorrectos.";
  S=st;SALT=salt;CK=k;unlock()});
 $("#gwipe").onclick=()=>{const b=$("#gwipe");if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Pulsa otra vez para borrarlo todo";return}try{localStorage.removeItem(LOCK)}catch(e){}S=sample();gateSetup()};
}
function unlock(){OPEN=true;gate.hidden=true;gate.innerHTML="";app.hidden=false;view="hoy";render();poke()}
async function lock(){if(!OPEN)return;OPEN=false;clearTimeout(idle);
 if(CLOUD){clearTimeout(pushT);if(dirty)await push().catch(()=>{});await sb.auth.signOut({scope:"local"}).catch(()=>{})}else await chain;
 closeNotif();if(dlg.open)dlg.close();P.len=25;resetP();R=null;CK=null;UID=null;S=sample();main.innerHTML="";document.title=TITLE;
 if(CLOUD)return gateCloudLogin("");
 const lk=readLock();lk?gateLogin(lk):gateSetup()}

/* Acceso con cuenta: entrar, crear cuenta, recuperar contraseña */
const authErr=e=>{const m=(e?.message||"").toLowerCase();
 return m.includes("invalid login")?"Correo o contraseña incorrectos.":m.includes("not confirmed")?"Confirma antes tu correo con el enlace que te enviamos.":m.includes("already registered")?"Ese correo ya tiene cuenta. Entra con él.":m.includes("signups not allowed")||m.includes("signup is disabled")?"El registro está cerrado. Pide acceso a quien te dio esta web.":m.includes("rate limit")?"Demasiados intentos. Espera unos minutos.":m.includes("different from the old")?"Elige una contraseña distinta de la anterior.":"No se pudo completar. Revisa tu conexión e inténtalo de nuevo."};
function gateMsg(title,text,retry){app.hidden=true;gate.hidden=false;gate.innerHTML=`<div class="gate-card"><div class="seal">§</div><h1>${title}</h1><p class="sub">${text}</p>${retry?`<button class="btn" id="gretry">Reintentar</button>`:""}</div>`;if(retry)$("#gretry").onclick=retry}
function gateCloudLogin(info){gateShow(`<h1>Entra en tu cuaderno</h1>${info?`<p class="sub">${info}</p>`:""}
 <label for="g-mail">Correo<input id="g-mail" name="email" type="email" autocomplete="username" required></label>
 <label for="g-pass">Contraseña<input id="g-pass" name="pass" type="password" autocomplete="current-password" required></label>
 <label for="g-keep" style="flex-direction:row;align-items:center;gap:8px"><input id="g-keep" name="keep" type="checkbox" style="width:auto" ${keep()?"checked":""}>Mantener la sesión abierta (solo en tu propio dispositivo)</label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Entrar</button>
 <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><button type="button" class="linkbtn" id="gnew">Crear cuenta</button><button type="button" class="linkbtn" id="gforgot">He olvidado mi contraseña</button></div>`,
 async d=>{const k=!!d.keep;if(k!==keep()){try{k?localStorage.setItem("cuaderno-keep","1"):localStorage.removeItem("cuaderno-keep")}catch(e){}mkClient()}
  const {data,error}=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.pass});if(error)return authErr(error);
  await openCloud(data.session)});
 $("#gnew").onclick=gateCloudSignup;$("#gforgot").onclick=gateCloudForgot}
function gateCloudSignup(){gateShow(`<h1>Crea tu cuenta</h1><p class="sub">Con tu correo y una contraseña tendrás el mismo cuaderno en el móvil y en el portátil.</p>
 <label for="g-mail">Correo<input id="g-mail" name="email" type="email" autocomplete="username" required></label>
 <label for="g-pass">Contraseña (mínimo 8 caracteres)<input id="g-pass" name="pass" type="password" autocomplete="new-password" required minlength="8"></label>
 <label for="g-pass2">Repite la contraseña<input id="g-pass2" name="pass2" type="password" autocomplete="new-password" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Crear cuenta</button>
 <button type="button" class="linkbtn" id="gback">Ya tengo cuenta</button>`,
 async d=>{if(d.pass.length<8)return "La contraseña necesita al menos 8 caracteres.";if(d.pass!==d.pass2)return "Las contraseñas no coinciden.";
  const {data,error}=await sb.auth.signUp({email:d.email.trim(),password:d.pass,options:{emailRedirectTo:HERE}});if(error)return authErr(error);
  if(data.session)await openCloud(data.session);else gateCloudLogin("Te hemos enviado un correo. Abre su enlace para confirmar la cuenta y después entra aquí.")});
 $("#gback").onclick=()=>gateCloudLogin("")}
function gateCloudForgot(){gateShow(`<h1>Recupera tu contraseña</h1><p class="sub">Te enviamos un enlace al correo para que elijas una nueva.</p>
 <label for="g-mail">Correo<input id="g-mail" name="email" type="email" autocomplete="username" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Enviar enlace</button>
 <button type="button" class="linkbtn" id="gback">Volver</button>`,
 async d=>{const {error}=await sb.auth.resetPasswordForEmail(d.email.trim(),{redirectTo:HERE});if(error)return authErr(error);
  gateCloudLogin("Si ese correo tiene cuenta, recibirá un enlace para cambiar la contraseña.")});
 $("#gback").onclick=()=>gateCloudLogin("")}
function gateNewPass(){gateShow(`<h1>Elige tu nueva contraseña</h1>
 <label for="g-pass">Nueva contraseña (mínimo 8 caracteres)<input id="g-pass" name="pass" type="password" autocomplete="new-password" required minlength="8"></label>
 <label for="g-pass2">Repítela<input id="g-pass2" name="pass2" type="password" autocomplete="new-password" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Guardar y entrar</button>`,
 async d=>{if(d.pass.length<8)return "La contraseña necesita al menos 8 caracteres.";if(d.pass!==d.pass2)return "Las contraseñas no coinciden.";
  const {error}=await sb.auth.updateUser({password:d.pass});if(error)return authErr(error);
  const {data}=await sb.auth.getSession();if(!data.session)return gateCloudLogin("Contraseña cambiada. Entra con ella."),"";
  await openCloud(data.session)})}
async function bootCloud(){
 const h=location.hash, rec=/type=recovery/.test(h), bad=/error=/.test(h);
 gateMsg("Abriendo tu cuaderno","Un momento…");
 try{await loadSupa();mkClient();const {data}=await sb.auth.getSession();
  if(data.session&&rec)return gateNewPass();
  if(data.session)return await openCloud(data.session);
  gateCloudLogin(bad?"Ese enlace ha caducado o ya se usó. Pide otro.":"")}
 catch(e){gateMsg("No se pudo conectar","Revisa tu conexión a internet. Tu cuaderno sigue a salvo en tu cuenta.",bootCloud)}}
document.addEventListener("visibilitychange",()=>{if(!CLOUD||!OPEN)return;
 if(document.hidden){if(dirty){clearTimeout(pushT);flush()}}
 else if(!dirty&&!dlg.open&&!R)pull().then(ch=>{if(ch&&OPEN)render()}).catch(()=>{})});
window.addEventListener("online",()=>{if(CLOUD&&OPEN&&dirty)flush()});
/* Se cierra sola tras 20 minutos sin tocar nada, salvo con el temporizador en marcha */
let idle=null;
function poke(){clearTimeout(idle);if(OPEN&&!(CLOUD&&keep()))idle=setTimeout(()=>P.run?poke():lock(),20*60e3)}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,poke,{passive:true}));
$("#lockBtn").onclick=lock;
if(CLOUD)bootCloud();
else if(!window.crypto?.subtle)gate.innerHTML=`<div class="gate-card"><div class="seal">§</div><h1>Abre el cuaderno por https</h1><p class="sub">Para cifrar tus datos, el navegador exige una dirección segura (https) o abrir el archivo directamente desde tu ordenador.</p></div>`;
else{const lk=readLock();lk?gateLogin(lk):gateSetup()}
</script>
