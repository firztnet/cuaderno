["billofrights",1689,"12-16","poder","Bill of Rights inglés","Tras la Revolución Gloriosa, el Parlamento fija los límites de la Corona.","Consolida la supremacía del Parlamento: el rey no puede suspender leyes ni cobrar impuestos sin su consentimiento.","Bill of Rights de 1689.","Parlamento del Reino Unido (parliament.uk)"],
["independencia",1776,"07-04","derechos","Declaración de Independencia de Estados Unidos","Las trece colonias rompen con la Corona británica.","Formula que los gobiernos derivan su poder del consentimiento de los gobernados y que existen derechos inalienables.","«Todos los hombres son creados iguales».","National Archives (archives.gov)"],
["constitucionusa",1787,"09-17","poder","Constitución de Estados Unidos","La Convención de Filadelfia aprueba la constitución escrita más antigua en vigor.","Modelo de separación de poderes, federalismo y control mutuo entre instituciones.","Artículos I, II y III: legislativo, ejecutivo y judicial.","National Archives (archives.gov)"],
["ddhc",1789,"08-26","derechos","Declaración de los Derechos del Hombre y del Ciudadano","La Asamblea Nacional francesa proclama derechos naturales e imprescriptibles.","Referencia del constitucionalismo europeo: libertad, igualdad ante la ley y soberanía nacional.","Art. 16: una sociedad sin garantía de derechos ni separación de poderes carece de Constitución.","Conseil constitutionnel (conseil-constitutionnel.fr)"],
["marbury",1803,"02-24","sentencia","Marbury v. Madison","El Tribunal Supremo de Estados Unidos resuelve una disputa por un nombramiento judicial.","Nace el control judicial de constitucionalidad: los jueces pueden dejar sin aplicar una ley contraria a la Constitución.","«Corresponde al poder judicial decir lo que es el derecho» (juez Marshall).","Oyez (oyez.org)"],
["cadiz",1812,"03-19","espana","Constitución de Cádiz","Las Cortes reunidas en Cádiz aprueban la primera Constitución española, «la Pepa».","Introduce en España la soberanía nacional y la división de poderes; influyó en Hispanoamérica y en Europa.","Art. 3: la soberanía reside esencialmente en la Nación.","Congreso de los Diputados (congreso.es)"],
["viena1815",1815,"06-09","tratado","Congreso de Viena","Las potencias reordenan Europa tras las guerras napoleónicas.","Inaugura el equilibrio de poder y el Concierto europeo: un siglo sin guerra general entre grandes potencias.","Acta final del Congreso de Viena.","Manual de Historia de las Relaciones Internacionales"],
["ginebra1864",1864,"08-22","tratado","Primer Convenio de Ginebra","Doce Estados acuerdan proteger a los militares heridos en campaña.","Nace el derecho internacional humanitario moderno, junto a la Cruz Roja.","Convenio de Ginebra de 1864.","Comité Internacional de la Cruz Roja (icrc.org)"],
["enmienda13",1865,"12-06","derechos","Abolición de la esclavitud en Estados Unidos","Se ratifica la Decimotercera Enmienda tras la Guerra de Secesión.","Convierte la abolición en norma constitucional.","Enmienda XIII: no habrá esclavitud ni servidumbre involuntaria, salvo como castigo por delito.","National Archives (archives.gov)"],
["pgm",1914,"07-28","conflicto","Estalla la Primera Guerra Mundial","Un mes después del atentado de Sarajevo, Austria-Hungría declara la guerra a Serbia y el sistema de alianzas arrastra a Europa.","Fin del orden de Viena y de cuatro imperios. Es el caso clásico para estudiar las alianzas y el dilema de seguridad.","","Manual de Historia de las Relaciones Internacionales"],
["versalles",1919,"06-28","tratado","Tratado de Versalles","Los vencedores imponen la paz a Alemania y se crea la Sociedad de Naciones.","Primer intento de seguridad colectiva. Sus condiciones alimentaron el revanchismo que llevó a 1939.","Art. 231: responsabilidad de Alemania por la guerra. Parte I: Pacto de la Sociedad de Naciones.","Manual de Historia de las Relaciones Internacionales"],
["briandkellogg",1928,"08-27","tratado","Pacto Briand-Kellogg","Los Estados firmantes renuncian a la guerra como instrumento de política nacional.","No evitó la guerra, pero es el antecedente de la prohibición del uso de la fuerza y sirvió de base en Núremberg.","Pacto de París de 1928.","Manual de Derecho Internacional Público"],
["republica1931",1931,"12-09","espana","Constitución de la Segunda República","Las Cortes constituyentes aprueban una Constitución democrática y social.","Introdujo el sufragio femenino, el Tribunal de Garantías Constitucionales y las autonomías regionales.","Art. 1: España es una República democrática de trabajadores de toda clase.","Congreso de los Diputados (congreso.es)"],
["sgm",1939,"09-01","conflicto","Comienza la Segunda Guerra Mundial","Alemania invade Polonia; Francia y el Reino Unido le declaran la guerra dos días después.","De su final salen la ONU, los juicios de Núremberg, el orden bipolar y los derechos humanos como asunto internacional.","","Manual de Historia de las Relaciones Internacionales"],
["cartaonu",1945,"06-26","tratado","Carta de las Naciones Unidas","Cincuenta Estados firman la Carta en San Francisco; entra en vigor el 24 de octubre.","Texto base del orden internacional actual: prohíbe el uso de la fuerza y crea el Consejo de Seguridad.","Art. 2.4: prohibición de la amenaza o el uso de la fuerza. Art. 51: legítima defensa.","Naciones Unidas (un.org)"],
["nuremberg",1945,"11-20","sentencia","Juicios de Núremberg","Un tribunal militar internacional juzga a los principales dirigentes nazis; dicta sentencia el 1 de octubre de 1946.","Establece la responsabilidad penal individual por crímenes internacionales: obedecer órdenes no exime.","Estatuto de Londres: crímenes contra la paz, crímenes de guerra y crímenes contra la humanidad.","Manual de Derecho Internacional Público"],
["dudh",1948,"12-10","derechos","Declaración Universal de Derechos Humanos","La Asamblea General de la ONU la aprueba en París, un día después de la Convención contra el Genocidio.","Primer catálogo universal de derechos. No es un tratado, pero inspira los posteriores y buena parte se considera costumbre.","Resolución 217 A (III). Art. 1: todos los seres humanos nacen libres e iguales en dignidad y derechos.","Naciones Unidas (un.org)"],
["otan",1949,"04-04","tratado","Tratado del Atlántico Norte","Doce Estados occidentales crean la OTAN en Washington.","Ejemplo central de alianza de defensa colectiva durante la Guerra Fría y después.","Art. 5: un ataque armado contra uno se considera un ataque contra todos.","OTAN (nato.int)"],
["ginebra1949",1949,"08-12","tratado","Convenios de Ginebra","Se aprueban los cuatro Convenios que protegen a heridos, náufragos, prisioneros y civiles.","Núcleo del derecho internacional humanitario; ratificados por prácticamente todos los Estados.","Art. 3 común: mínimos de humanidad también en conflictos internos.","Comité Internacional de la Cruz Roja (icrc.org)"],
["cedh",1950,"11-04","derechos","Convenio Europeo de Derechos Humanos","Los Estados del Consejo de Europa firman el Convenio en Roma.","Crea el Tribunal de Estrasburgo: una persona puede demandar a su propio Estado ante un tribunal internacional.","Art. 6: derecho a un proceso equitativo. Art. 34: demanda individual.","Tribunal Europeo de Derechos Humanos (echr.coe.int)"],
["brown",1954,"05-17","sentencia","Brown v. Board of Education","El Tribunal Supremo de Estados Unidos declara inconstitucional la segregación racial en las escuelas públicas.","Abandona la doctrina «separados pero iguales» y muestra cómo un tribunal puede impulsar un cambio social.","Enmienda XIV, cláusula de igual protección.","Oyez (oyez.org)"],
["roma1957",1957,"03-25","tratado","Tratados de Roma","Seis Estados crean la Comunidad Económica Europea y el Euratom.","Origen de la actual Unión Europea: un mercado común con instituciones y un derecho propios.","Tratado constitutivo de la CEE.","EUR-Lex (eur-lex.europa.eu)"],
["res1514",1960,"12-14","derechos","Declaración sobre la descolonización","La Asamblea General aprueba la Resolución 1514 (XV).","Consagra la libre determinación de los pueblos coloniales; en pocos años decenas de nuevos Estados entran en la ONU.","Resolución 1514 (XV): todos los pueblos tienen derecho a la libre determinación.","Naciones Unidas (un.org)"],
["misiles",1962,"10-16","conflicto","Crisis de los misiles de Cuba","Estados Unidos descubre misiles soviéticos en Cuba; trece días de máxima tensión nuclear.","Caso de estudio por excelencia sobre disuasión, toma de decisiones en crisis y negociación entre superpotencias.","","Manual de Historia de las Relaciones Internacionales"],
["vangend",1963,"02-05","sentencia","Van Gend en Loos","El Tribunal de Justicia de las Comunidades resuelve una disputa aduanera neerlandesa.","Declara el efecto directo: el derecho comunitario da derechos a los particulares. Un año después, Costa c. ENEL añade la primacía.","Asunto 26/62. Costa c. ENEL: asunto 6/64.","EUR-Lex (eur-lex.europa.eu)"],
["pactos1966",1966,"12-16","derechos","Pactos Internacionales de Derechos Humanos","La Asamblea General aprueba el Pacto de Derechos Civiles y Políticos y el de Derechos Económicos, Sociales y Culturales.","Convierten la Declaración Universal en obligaciones jurídicas para los Estados que los ratifican.","Art. 1 común: derecho de los pueblos a la libre determinación.","Naciones Unidas (un.org)"],
["cvdt",1969,"05-23","tratado","Convención de Viena sobre el Derecho de los Tratados","Se adopta el «tratado de los tratados»; entra en vigor en 1980.","Regula cómo se celebran, interpretan, modifican y terminan los tratados. Imprescindible en Derecho Internacional Público.","Art. 26: pacta sunt servanda. Art. 31: regla de interpretación. Art. 53: ius cogens.","Colección de Tratados de la ONU (treaties.un.org)"],
["pentagono",1971,"06-30","poder","Los Papeles del Pentágono","El Gobierno de Nixon intenta impedir que la prensa publique un informe secreto sobre Vietnam.","El Tribunal Supremo protege la publicación: la censura previa exige una justificación excepcional.","New York Times Co. v. United States. Primera Enmienda.","Oyez (oyez.org)"],
["nixon",1974,"07-24","poder","El caso Watergate y United States v. Nixon","Tras el allanamiento de la sede demócrata en 1972, el Supremo obliga al presidente a entregar las grabaciones. Nixon dimite el 9 de agosto.","Nadie está por encima de la ley: el privilegio ejecutivo no es absoluto y cede ante la justicia penal.","United States v. Nixon, decisión unánime.","Oyez (oyez.org)"],
["vietnam",1975,"04-30","conflicto","Fin de la guerra de Vietnam","Cae Saigón y termina la guerra con la victoria de Vietnam del Norte.","Límite del poder militar de una superpotencia y del apoyo interno a una guerra larga. Marcó la política exterior de Estados Unidos.","","Manual de Historia de las Relaciones Internacionales"],
["ce1978",1978,"12-06","espana","Constitución española","Los españoles la aprueban en referéndum; se sanciona el 27 y se publica en el BOE el 29 de diciembre.","Establece el Estado social y democrático de Derecho, la monarquía parlamentaria y el Estado de las autonomías.","Art. 1.1: valores superiores. Art. 9.3: legalidad y seguridad jurídica. Art. 53: garantías de los derechos.","BOE (boe.es)"],
["23f",1981,"02-23","espana","Golpe de Estado del 23-F","Un grupo de guardias civiles asalta el Congreso durante la votación de investidura; el golpe fracasa en horas.","Prueba de fuego de la democracia. Los responsables fueron juzgados y condenados en el juicio de Campamento.","Delito de rebelión militar. Sentencia del Consejo Supremo de Justicia Militar de 1982, agravada después por el Tribunal Supremo.","Congreso de los Diputados (congreso.es)"],
["cee1986",1986,"01-01","espana","España entra en las Comunidades Europeas","Tras firmar el Acta de Adhesión en junio de 1985, España y Portugal se incorporan a la CEE.","El derecho europeo pasa a aplicarse en España con primacía y efecto directo.","Art. 93 de la Constitución: cesión de competencias a organizaciones internacionales.","EUR-Lex (eur-lex.europa.eu)"],
["nicaragua",1986,"06-27","sentencia","Nicaragua contra Estados Unidos","La Corte Internacional de Justicia condena a Estados Unidos por su apoyo a la «contra» y el minado de puertos.","Sentencia de referencia sobre uso de la fuerza, no intervención y legítima defensa, y sobre cómo se prueba la costumbre.","Actividades militares y paramilitares en y contra Nicaragua, sentencia sobre el fondo.","Corte Internacional de Justicia (icj-cij.org)"],
["muro",1989,"11-09","conflicto","Cae el Muro de Berlín","La RDA abre sus fronteras y miles de personas cruzan el Muro.","Símbolo del fin de la Guerra Fría: dos años después desaparece la Unión Soviética y termina el orden bipolar.","","Manual de Historia de las Relaciones Internacionales"],
["maastricht",1992,"02-07","tratado","Tratado de Maastricht","Los doce Estados miembros firman el Tratado de la Unión Europea.","Crea la Unión Europea, la ciudadanía europea y el camino hacia el euro.","Tratado de la Unión Europea.","EUR-Lex (eur-lex.europa.eu)"],
["adhoc",1993,"05-25","conflicto","Yugoslavia, Ruanda y los tribunales ad hoc","El Consejo de Seguridad crea el Tribunal para la antigua Yugoslavia y, en 1994, tras el genocidio de Ruanda, el de Ruanda.","Primeros tribunales penales internacionales desde Núremberg. Abrieron el camino a la Corte Penal Internacional.","Resoluciones 827 (1993) y 955 (1994) del Consejo de Seguridad.","Naciones Unidas (un.org)"],
["estatutoroma",1998,"07-17","tratado","Estatuto de Roma","Se adopta el tratado que crea la Corte Penal Internacional; entra en vigor el 1 de julio de 2002.","Primer tribunal penal internacional permanente, complementario de las jurisdicciones nacionales.","Art. 5: genocidio, crímenes de lesa humanidad, crímenes de guerra y agresión.","Corte Penal Internacional (icc-cpi.int)"],
["pinochet",1998,"10-16","sentencia","El caso Pinochet","El exdictador chileno es detenido en Londres a petición de un juez español.","Impulso decisivo a la jurisdicción universal: un antiguo jefe de Estado no tiene inmunidad frente a la tortura.","Decisión de la Cámara de los Lores de marzo de 1999. Convención contra la Tortura de 1984.","Manual de Derecho Internacional Público"],
["11s",2001,"09-11","conflicto","Atentados del 11 de septiembre","Al Qaeda ataca Nueva York y Washington con aviones secuestrados.","Abre el debate sobre la legítima defensa frente a actores no estatales. La OTAN invoca su artículo 5 por primera vez.","Resoluciones 1368 y 1373 (2001) del Consejo de Seguridad.","Naciones Unidas (un.org)"],
["irak",2003,"03-20","conflicto","Invasión de Irak","Una coalición liderada por Estados Unidos invade Irak sin una autorización expresa del Consejo de Seguridad.","Caso central para discutir la legalidad del uso de la fuerza y la doctrina de la guerra preventiva.","Debate sobre el alcance de la Resolución 1441 (2002).","Manual de Derecho Internacional Público"],
["opmuro",2004,"07-09","sentencia","Opinión consultiva sobre el muro en Palestina","La Corte Internacional de Justicia examina el muro construido por Israel en territorio palestino ocupado.","Afirma que su trazado es contrario al derecho internacional y que los derechos humanos se aplican también en territorio ocupado.","Opinión consultiva de 9 de julio de 2004.","Corte Internacional de Justicia (icj-cij.org)"],
["lisboa",2007,"12-13","tratado","Tratado de Lisboa","Se firma la reforma que da a la Unión Europea su forma actual; entra en vigor en 2009.","Da valor jurídico a la Carta de Derechos Fundamentales y regula por primera vez la retirada de un Estado.","Art. 50 TUE: retirada de la Unión. Art. 6 TUE: Carta de Derechos Fundamentales.","EUR-Lex (eur-lex.europa.eu)"],
["kosovo",2010,"07-22","sentencia","Opinión consultiva sobre Kosovo","La Corte Internacional de Justicia responde sobre la declaración de independencia de Kosovo de 2008.","Concluye que la declaración no violó el derecho internacional, sin pronunciarse sobre si existe un derecho a la secesión.","Opinión consultiva de 22 de julio de 2010.","Corte Internacional de Justicia (icj-cij.org)"],
["crimea",2014,"03-18","conflicto","Anexión de Crimea","Rusia se anexiona Crimea; días después la Asamblea General de la ONU defiende la integridad territorial de Ucrania.","Aplicación actual del principio de que la adquisición de territorio por la fuerza no se reconoce.","Resolución 68/262 de la Asamblea General, de 27 de marzo de 2014.","Naciones Unidas (un.org)"],
["brexit",2016,"06-23","tratado","Referéndum del Brexit","El Reino Unido vota abandonar la Unión Europea; la salida se hace efectiva el 31 de enero de 2020.","Primera vez que un Estado activa el artículo 50 y se retira de la Unión.","Art. 50 del Tratado de la Unión Europea.","EUR-Lex (eur-lex.europa.eu)"],
["ucrania",2022,"02-24","conflicto","Invasión rusa de Ucrania","Rusia lanza una invasión a gran escala de Ucrania.","La mayor guerra entre Estados en Europa desde 1945: pone a prueba la prohibición del uso de la fuerza y la seguridad colectiva.","Resolución ES-11/1 de la Asamblea General, de 2 de marzo de 2022.","Naciones Unidas (un.org)"]
];
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const allHitos=()=>[...HITOS.map(a=>({id:a[0],y:a[1],d:a[2],k:a[3],t:a[4],q:a[5],w:a[6],n:a[7],src:a[8],own:false})),...S.hitos.map(h=>({...h,own:true}))].sort((a,b)=>a.y-b.y||String(a.d).localeCompare(String(b.d)));
const MESL_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const hitoDate=h=>h.d?(LANG==="en"?`${+h.d.slice(3)} ${MESL_EN[+h.d.slice(0,2)-1]} ${h.y}`:`${+h.d.slice(3)} de ${MESL[+h.d.slice(0,2)-1]} de ${h.y}`):String(h.y);
let HKF="", HQ="", HID=null, hitoT=null;
function openHito(id){HID=id;go("hito")}
function hoyHito(){const md=today().slice(5),h=allHitos().find(x=>x.d===md);
 return h?`<div class="notice"><span><b>Tal día como hoy, en ${h.y}:</b> ${esc(h.t)}</span><button class="btn ghost small" data-hito="${esc(h.id)}">Ver el hito</button></div>`:""}
function paintHitos(){const box=$("#hlist");if(!box)return;const f=fold(HQ.trim());
 const L=allHitos().filter(h=>(!HKF||h.k===HKF)&&(!f||fold([h.t,h.q,h.w,h.n,h.y].join(" ")).includes(f)));
 const eras=[["Antes de 1900",h=>h.y<1900],["De 1900 a 1944",h=>h.y>=1900&&h.y<1945],["De 1945 a 1989",h=>h.y>=1945&&h.y<1990],["De 1990 a hoy",h=>h.y>=1990]];
 box.innerHTML=L.length?eras.map(([name,fn])=>{const g=L.filter(fn);return g.length?`<div class="era">${name}</div>${g.map(h=>`<button class="hrow k-${h.k}" data-hito="${esc(h.id)}"><span class="hy">${h.y}</span><span class="hb"><span class="pill k-${h.k}">${HKS[h.k]}</span><strong>${esc(h.t)}</strong><span class="sub">${esc(h.q)}</span>${h.own?`<span class="sub">Añadido por ti</span>`:""}${S.hitoMeta[h.id]&&S.hitoMeta[h.id].note?`<span class="sub">Con tu nota</span>`:""}</span></button>`).join("")}`:""}).join(""):`<div class="panel empty">Ningún hito coincide. Prueba con otra palabra o quita el filtro.</div>`;
 box.querySelectorAll("[data-hito]").forEach(b=>b.onclick=()=>openHito(b.dataset.hito))}
function vHitos(){
 main.innerHTML=`<div class="head"><div><div class="eyebrow">Hitos</div><h1>Lo que cambió el derecho y el mundo</h1><p>Tratados, guerras, sentencias y momentos que explican lo que estudias. Es material de apoyo para repasar: contrasta fechas y citas con tu manual antes de usarlas en un examen.</p></div><button class="btn" id="addHito">Añadir hito</button></div>
 <div class="toolbar" style="margin-bottom:10px"><input id="hq" type="search" placeholder="Buscar un hito, un año, un artículo…" aria-label="Buscar en los hitos" autocomplete="off" value="${esc(HQ)}"></div>
 <div class="hchips"><button class="chip" data-hk="" aria-pressed="${!HKF}">Todos</button>${Object.entries(HK).map(([k,v])=>`<button class="chip" data-hk="${k}" aria-pressed="${HKF===k}">${v}</button>`).join("")}</div>
 <div id="hlist"></div>`;
 paintHitos();
 const q=$("#hq");q.oninput=()=>{HQ=q.value;paintHitos()};
 main.querySelectorAll("[data-hk]").forEach(b=>b.onclick=()=>{HKF=b.dataset.hk;render()});
 $("#addHito").onclick=()=>hitoForm();
}
function vHito(){
 const h=allHitos().find(x=>x.id===HID);if(!h){view="hitos";return vHitos()}
 const meta=S.hitoMeta[h.id]||{note:"",subject:""};
 main.innerHTML=`<div class="head"><div><button class="iconbtn" id="hBack" style="margin-left:-6px">Volver a Hitos</button><div class="eyebrow">${HK[h.k]} · ${esc(hitoDate(h))}</div><h1>${esc(h.t)}</h1></div>
 <div class="hbtns">${h.own?`<button class="btn ghost" id="hEdit">Editar</button>`:""}<button class="btn" id="hCard">Hacer ficha</button></div></div>
 <div class="grid2"><div class="stack"><div class="panel hito" id="hText"><h2>Qué pasó</h2><p>${esc(h.q)}</p><h2>Por qué importa</h2><p>${esc(h.w)}</p>
 ${h.n?`<h2>Norma o sentencia clave</h2><div class="legal">${esc(h.n)}</div>`:""}
 ${h.src?`<p class="sub" style="margin-top:16px;font-size:13px">Para comprobarlo: ${esc(h.src)}.</p>`:""}</div></div>
 <div class="stack"><div class="panel stack"><h2>Mi nota</h2>
  <textarea id="hNote" style="min-height:150px" aria-label="Mi nota sobre este hito" placeholder="Qué dijo el profesor, con qué tema lo relacionas, qué te preguntarían…">${esc(meta.note)}</textarea>
  <label for="hSubj">Asignatura relacionada<select id="hSubj">${subjOptions(meta.subject,"Ninguna")}</select></label>
  <div class="sub" id="hSt">Se guarda sola. Si eliges una asignatura, el hito aparecerá en su página.</div></div></div></div>`;
 const put=()=>{const note=$("#hNote").value,subject=$("#hSubj").value;if(note.trim()||subject)S.hitoMeta[h.id]={note,subject};else delete S.hitoMeta[h.id]};
 const flush=()=>{clearTimeout(hitoT);hitoT=null;put();save();const st=$("#hSt");if(st)st.textContent="Guardado."};
 $("#hNote").oninput=()=>{put();clearTimeout(hitoT);hitoT=setTimeout(flush,600)};$("#hNote").onblur=flush;$("#hSubj").onchange=flush;
 $("#hBack").onclick=()=>go("hitos");
 const ed=$("#hEdit");if(ed)ed.onclick=()=>hitoForm(S.hitos.find(x=>x.id===h.id));
 $("#hCard").onclick=()=>{const sel=getSelection(),inText=sel.rangeCount&&$("#hText").contains(sel.anchorNode)?sel.toString().trim():"";
  cardForm(null,{q:`¿Qué fue «${h.t}» (${h.y}) y por qué importa?`,a:inText||(h.q+" "+h.w),subject:$("#hSubj").value})};
}
function hitoForm(h){openForm(h?"Editar hito":"Añadir hito",
 `<label class="full" for="f-ht">Título<input id="f-ht" name="t" required value="${esc(h?.t)}" placeholder="Sentencia, tratado, conflicto…"></label>
  <label for="f-hy">Año<input id="f-hy" name="y" type="number" required min="-3000" max="2100" step="1" value="${esc(h?h.y:new Date().getFullYear())}"></label>
  <label for="f-hk">Tipo<select id="f-hk" name="k">${Object.entries(HK).map(([k,v])=>`<option value="${k}" ${h?.k===k?"selected":""}>${v}</option>`).join("")}</select></label>
  <label class="full" for="f-hd">Día y mes, si lo sabes (por ejemplo 24-07)<input id="f-hd" name="dm" value="${esc(h&&h.d?h.d.slice(3)+"-"+h.d.slice(0,2):"")}" placeholder="24-07"></label>

  <p class="full sub" style="margin:0">Salen fichas al azar. Respondes, miras la respuesta y marcas si acertaste. Al acabar verás tu nota y las que fallaste.</p>`,

/* ---------- CALIFICACIONES: notas por asignatura, media ponderada y lo que hace falta para el objetivo ---------- */
function gradeCalc(name){const it=S.grades.filter(g=>g.subject===name),done=it.filter(g=>g.score!==null);
 if(!it.some(g=>g.weight>0))return {it,done,weighted:false,mean:done.length?done.reduce((a,g)=>a+g.score,0)/done.length:null};
 const totalW=it.reduce((a,g)=>a+g.weight,0),doneW=done.reduce((a,g)=>a+g.weight,0),pts=done.reduce((a,g)=>a+g.score*g.weight/100,0);
 const rem=Math.max(0,100-doneW),target=S.gradeGoal[name]||5;
 return {it,done,weighted:true,totalW,doneW,pts,rem,target,need:rem>0?(target-pts)/(rem/100):null,mean:doneW?pts/(doneW/100):null,final:rem===0?pts:null}}
function gradeText(g){
 if(!g.weighted)return g.mean===null?"Aún sin notas.":`Media de ${g.done.length} ${g.done.length===1?"nota":"notas"}: ${nf(g.mean)}. Añade el porcentaje de cada prueba para saber cuánto necesitas en lo que queda.`;
 if(g.final!==null)return `Nota final: ${nf(g.final)}. ${gradeLabel(g.final)}.`;
 if(!g.done.length)return `Aún sin notas. Para un ${nf(g.target)} necesitas esa media en el conjunto.`;
 if(g.need<=0)return `Ya tienes el ${nf(g.target)} asegurado con lo que llevas.`;

function answer(known){

  gateCloudCheck(d.email.trim())});
 regOpen().then(o=>{const i=$("#gsuInfo");if(o===false&&i)i.textContent="Acceso solo con invitación: usa el mismo correo en el que te invitaron y elige tu contraseña."});
 $("#gback").onclick=()=>gateCloudLogin("")}
/* Confirmación del correo: el enlace llega al correo y, al abrirlo, se entra directamente en Digesto */
function gateCloudCheck(email){gateShow(`<h1>Confirma tu correo</h1>
 <p class="sub">Te hemos enviado un enlace a <b translate="no">${esc(email)}</b>. Ábrelo y tu cuenta quedará lista.</p>
 <ul class="sub" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Puede tardar un par de minutos.</li><li>Si no lo ves, mira en «Spam» o «Promociones».</li><li>El enlace sirve una sola vez.</li></ul>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Reenviar el correo</button>
 <button type="button" class="linkbtn" id="gback">Ya lo he confirmado: entrar</button>`,
 async()=>{const {error}=await sb.auth.resend({type:"signup",email,options:{emailRedirectTo:HERE}});if(error)return authErr(error);
  const b=$("#gateForm [type=submit]");let n=60;const tick=()=>{if(!b.isConnected)return clearInterval(t);n--;if(n>0)b.textContent=`Reenviar en ${n} s`;else{clearInterval(t);b.textContent="Reenviar el correo";delete b.dataset.busy}};
  b.textContent="Reenviar en 60 s";const t=setInterval(tick,1000);toast("Correo reenviado. Mira tu bandeja de entrada.");return ""});
 $("#gback").onclick=()=>{gateCloudLogin("");const m=$("#g-mail");if(m){m.value=email;$("#g-pass").focus()}}}
function gateCloudForgot(){gateShow(`<h1>Recupera tu contraseña</h1><p class="sub">Te enviamos un enlace al correo para que elijas una nueva.</p>
 <label for="g-mail">Correo<input id="g-mail" name="email" type="email" autocomplete="username" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Enviar enlace</button>
 <button type="button" class="linkbtn" id="gback">Volver</button>`,
 async d=>{const {error}=await sb.auth.resetPasswordForEmail(d.email.trim(),{redirectTo:HERE});if(error)return authErr(error);
  gateCloudLogin("Si ese correo tiene cuenta, recibirá un enlace para cambiar la contraseña.")});
 $("#gback").onclick=()=>gateCloudLogin("")}
function gateNewPass(){gateShow(`<h1>Elige tu nueva contraseña</h1>
 <label for="g-pass">Nueva contraseña (mínimo 8 caracteres)<input id="g-pass" name="pass" type="password" autocomplete="new-password" required minlength="8"></label>
 <label for="g-pass2">Repítela<input id="g-pass2" name="pass2" type="password" autocomplete="new-password" required></label>
 <div class="gerr" id="gerr" role="alert"></div>
 <button class="btn" type="submit">Guardar y entrar</button>`,
 async d=>{if(d.pass.length<8)return "La contraseña necesita al menos 8 caracteres.";if(d.pass!==d.pass2)return "Las contraseñas no coinciden.";
  const {error}=await sb.auth.updateUser({password:d.pass});if(error)return authErr(error);
  const {data}=await sb.auth.getSession();if(!data.session)return gateCloudLogin("Contraseña cambiada. Entra con ella."),"";
  await openCloud(data.session)})}
async function bootCloud(){
 const h=location.hash, rec=/type=recovery/.test(h), bad=/error=/.test(h), conf=/type=(signup|email|invite)/.test(h);
 gateMsg("Abriendo Digesto","Un momento…");
 try{await loadSupa();mkClient();loadComs();const {data}=await sb.auth.getSession();
  if(data.session&&rec)return gateNewPass();
  if(data.session){await openCloud(data.session);if(conf)toast("Correo confirmado. Te damos la bienvenida a Digesto.");return}
  gateCloudLogin(bad?"Ese enlace ha caducado o ya se usó. Si aún no has confirmado tu correo, entra con tu contraseña y podrás pedir otro.":"")}
 catch(e){gateMsg("No se pudo conectar","Revisa tu conexión a internet. Tu cuaderno sigue a salvo en tu cuenta.",bootCloud)}}
document.addEventListener("visibilitychange",()=>{if(!CLOUD||!OPEN)return;
 if(DEMO)return;
 if(document.hidden){if(dirty){clearTimeout(pushT);flush()}}
 else if(canRefresh())pull().then(ch=>{if(ch&&OPEN&&canRefresh())render()}).catch(()=>{})});
window.addEventListener("online",()=>{if(CLOUD&&OPEN&&dirty)flush()});
/* Se cierra sola tras 20 minutos sin tocar nada, salvo con el temporizador en marcha */
let idle=null;
function poke(){clearTimeout(idle);if(OPEN&&!(CLOUD&&keep()))idle=setTimeout(()=>P.run?poke():lock(),20*60e3)}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,poke,{passive:true}));
$("#lockBtn").onclick=lock;
if(CLOUD)bootCloud();
else if(!window.crypto?.subtle)gate.innerHTML=`<div class="gate-card"><div class="seal">§</div><h1>Abre Digesto por https</h1><p class="sub">Para cifrar tus datos, el navegador exige una dirección segura (https) o abrir el archivo directamente desde tu ordenador.</p></div>`;
else{const lk=readLock();lk?gateLogin(lk):gateSetup()}
</script>
