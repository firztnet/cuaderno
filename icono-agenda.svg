<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Agenda Firztnet">
  <title>Agenda Firztnet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19b5a5"/>
      <stop offset="1" stop-color="#0d4a5a"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f5e"/>
      <stop offset="1" stop-color="#ee5a3a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04262e" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- Fondo turquesa propio de la agenda -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Hoja de calendario con cabecera coral -->
  <g filter="url(#sh)">
    <rect x="100" y="116" width="312" height="300" rx="42" fill="#ffffff"/>
    <path d="M100 158a42 42 0 0 1 42-42h228a42 42 0 0 1 42 42v46H100z" fill="url(#hd)"/>
  </g>
  <!-- Anillas -->
  <rect x="168" y="86" width="26" height="68" rx="13" fill="#0d4a5a"/>
  <rect x="318" y="86" width="26" height="68" rx="13" fill="#0d4a5a"/>
  <!-- La F de Firztnet -->
  <g fill="#0d4a5a">
    <rect x="186" y="236" width="44" height="148" rx="12"/>
    <rect x="186" y="236" width="132" height="42" rx="12"/>
    <rect x="186" y="300" width="100" height="38" rx="12"/>
  </g>
  <!-- Sello de «hecho» -->
  <circle cx="370" cy="370" r="62" fill="#22c55e" stroke="#ffffff" stroke-width="12"/>
  <path d="M341 371l20 20 39-41" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
